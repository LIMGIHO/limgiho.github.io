# Site
version: 2
name: 임기호
title: Software Engineer | Full-Stack · Platform · Integration
url: https://limgiho.github.io
baseurl: ""

# Build
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - applications/**/README.md
  - applications/**/build.sh
  - applications/**/cover-letter.md
  - applications/**/fit-analysis.md
  - applications/**/job-posting.md
  - applications/**/portfolio.pdf
  - applications/**/resume.pdf
  - applications/**/source
  - applications/**/source/**
  - applications/2026-08-03/kakaopay-fde/source/index.html
  - applications/2026-08-03/kakaopay-fde/source/resume.css
  - applications/**/verify.py
  - docker-compose.yml
  - docs/
  - lib/
  - node_modules/
  - output/
  - scripts/
  - tests/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
