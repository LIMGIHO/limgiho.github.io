# Site
version: 2
name: 임기호
title: Software Engineer | Full-Stack · Platform · Integration
url: https://limgiho.github.io
baseurl: ""

# Build
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - applications/
  - docker-compose.yml
  - docs/
  - lib/
  - node_modules/
  - output/
  - scripts/
  - tests/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
