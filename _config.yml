        link: https://play.google.com/store/apps/details?id=com.healthdog.app
        link_text: 스토어 링크
        description: |
          운동 기록·조회·통계 앱을 혼자 개발했습니다.
          Google OAuth 로그인, Firebase·Supabase 데이터 동기화, AdMob 광고와 RevenueCat 구독 결제를 연동했습니다.

