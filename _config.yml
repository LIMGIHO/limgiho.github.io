# About Section
about_title: 소개
about_content: |
  <p class="hero-kicker">반복 입력과 수기 대조를 줄이는 업무 시스템을 만듭니다.</p>

  2010년부터 제조·물류 시스템을 개발하고 운영해 온 임기호입니다.
  Node.js·TypeScript와 C#·.NET으로 업무 시스템을 만들고 데이터 이관과 외부 연동, 배포까지 맡아 왔습니다.
  최근에는 LLM과 OCR을 통관 서류 검증에 적용했습니다.

  [포트폴리오에서 설계와 구현 과정 보기](/portfolio/)

content:
  - title: 경력
    layout: list
    content:
      - layout: left
        border: weak
        title: KWE Korea
        link: https://www.kwe.com/
        link_text: www.kwe.com
        sub_title: 전략개발부 차장 (Lead Software Engineer)
        caption: 2022.01 ~ 현재
        quote: 국제 종합 물류 기업
        description: |
          사내 시스템 개발과 운영을 리드합니다. 항공·해운 수출입과 재무 업무를 담당하며
          부서마다 달랐던 처리 절차와 데이터 기준을 정리하고 팀의 코드 구조와 배포 기준을 마련했습니다.

      - layout: left
        title: ILJIN Global
        link: https://www.iljin.com/
        link_text: www.iljin.com
        sub_title: 생산관리시스템(MES) 개발팀 과장 (Software Engineer)
        caption: 2010.12 ~ 2022.01
        quote: 베어링 제조 기업
        description: |
          MES 개발팀에서 생산·납품·재고 데이터를 다루는 업무 시스템을 개발하고 운영했습니다.
          국내외 공장의 MES 리뉴얼과 SAP 연동, 설비 데이터 수집을 담당했습니다.

  - title: 주요 프로젝트
    layout: list
    content:
      - layout: left
        border: weak
        title: 통관 서류 검증 자동화
        sub_title: KWE Korea
        caption: 2026.06 - 2026.08
        quote: Local LLM, Tesseract OCR, Vitest
        description: |
          미국·중국 통관 서류를 담당자가 수작업으로 대조하던 업무에 검증 시스템을 도입했습니다.

          - 서류 9종의 품목·수량·금액 등 55개 항목에서 누락과 불일치를 자동으로 찾도록 구현했습니다.
          - 1,130행의 설비 리스트를 업로드하고 회차별로 조회·편집하며 변경분을 확인할 수 있게 했습니다.
          - 검증 결과 수정과 거래처 회신용 메일 생성을 연결했습니다.
          - 월 약 22,000개 항목의 수작업 검증을 자동화해 **월 약 200시간을 절감**했습니다.

      - layout: left
        border: weak
        title: 웹 기반 통합 사내 시스템 구축
        sub_title: KWE Korea
        caption: 2023.09 - 2026.07
        quote: Express, Next.js, Turborepo, PostgreSQL, PL/pgSQL, PM2, Worker Threads
        description: |
          항공·해운·재무 업무가 개별 프로그램과 서로 다른 DB에 나뉘어 있어 같은 정보를 반복 입력하고 수기로 대조해야 했습니다.

          - **15종 이상의 개별 시스템**을 항공·해운 수출입 및 재무 업무를 다루는 단일 웹 플랫폼으로 통합했습니다.
          - 시스템마다 달랐던 데이터 기준과 처리 절차를 공통 업무 흐름으로 정리했습니다.
          - 관세청 API와 스크래핑을 연동해 건당 약 10분 걸리던 조회를 **5초 이내**로 줄였습니다.
          - 모노레포와 공용 라이브러리로 중복 코드를 줄이고 기능 변경의 영향 범위를 관리했습니다.

          [시스템 구성과 설계 판단 보기](/portfolio/#implementation-architecture)

      - layout: left
        border: weak
        title: Docker Swarm 기반 CI/CD 표준 배포 체계 구축
        sub_title: KWE Korea
        caption: 2025.11 - 2025.12
        quote: GitLab CI/CD, Docker, Docker Swarm, Portainer
        description: |
          PM2 중심의 수동 배포는 서버 환경에 따라 결과가 달라졌고 테스트 누락 방지와 롤백 기준도 부족했습니다.

          - GitLab CI/CD를 테스트 → 빌드 → 배포 순서로 구성하고 테스트 실패 시 후속 단계를 차단했습니다.
          - 브랜치·SHA 태그와 디제스트로 컨테이너 이미지를 식별해 같은 이미지를 다시 배포할 수 있도록 했습니다.
          - 빌드·배포 로그와 아티팩트로 변경 이력을 추적하고 Portainer에서 서비스 상태와 로그를 확인하도록 구성했습니다.

      - layout: left
        border: weak
        title: 백엔드 리팩토링 (Express → NestJS)
        sub_title: KWE Korea
        caption: 2025.06 - 2025.10
        quote: Node.js, NestJS, PostgreSQL, Prisma, Redis, BullMQ
        description: |
          기능이 늘면서 Express 서비스의 코드 구조가 제각각이 되었고 테스트를 작성하기도 어려웠습니다.

          - NestJS의 도메인별 모듈과 DI로 코드 구조를 정리하고 인증·로깅 등 공통 로직을 재사용하도록 분리했습니다.
          - Redis와 BullMQ로 무거운 작업을 비동기 배치로 옮기고 인증 데이터를 캐싱해 DB 부하를 줄였습니다.
          - 팀 코드 컨벤션과 TDD 기반 개발 환경을 마련하고 단위·통합 테스트로 변경 영향을 검증하도록 했습니다.

      - layout: left
        border: weak
        title: 고객사 ERP 연동 자동화
        sub_title: KWE Korea
        caption: 2024.08 - 2024.12
        quote: C# (.NET 4.5), WinForms, OCR, MySQL
        description: |
          고객사 시스템에 데이터를 입력하는 시간이 길어 업무팀의 야근이 잦았습니다.

          - RPA로 문서 검증과 입력을 자동화해 **월 1,200시간을 절감**했습니다.
          - 실시간 처리로 입력 누락과 오입력 가능성을 줄였습니다.

      - layout: left
        border: weak
        title: 세금계산서 시스템 리뉴얼·DB 이관
        sub_title: KWE Korea
        caption: 2023.01 - 2023.07
        quote: C# (.NET 6), gRPC, WinForms, PostgreSQL, PL/pgSQL
        description: |
          Oracle Forms 기반 시스템의 유지보수 문제와 Oracle 라이선스 비용을 줄이기 위해 .NET 6과 PostgreSQL로 전환했습니다.

          - **1,000만 건의 데이터 이관을 자동화**하고 정합성을 검증했습니다.
          - 스마트빌을 연동해 국세청 즉시 신고와 매입 데이터 실시간 처리를 구현했습니다.

  - title: 이전 프로젝트
    layout: list
    content:
      - layout: left
        border: weak
        title: 운반비 전산화
        sub_title: ILJIN Global
        caption: 2020.04 - 2020.07
        quote: C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle, PL/SQL
        description: |
          8개 공장의 수기 운반비 관리를 전산화하고 처리 절차를 통일했습니다.
          SAP를 연동해 운반비를 실시간으로 처리하도록 구현했으며 최우수사원 표창을 받았습니다.

      - layout: left
        border: weak
        title: 사내 MES - SAP 실시간 연동 인터페이스 개발
        sub_title: ILJIN Global
        caption: 2019.01 - 2019.12
        quote: C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle, PL/SQL
        description: |
          SAP와 MES 사이의 생산·납품·재고 이동 데이터를 실시간으로 연동했습니다.
          기준정보를 자동으로 이관해 수작업 전송과 중복 입력을 줄였습니다.

      - layout: left
        border: weak
        title: 제천·슬로바키아 공장 MES 리뉴얼
        sub_title: ILJIN Global
        caption: 2016.04 - 2017.12
        quote: VB6 → C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle 9i → 11g, PL/SQL
        description: |
          VB6 기반 MES를 C#으로 리뉴얼하고 Oracle을 업그레이드했습니다.
          LOT 단위 추적 시스템을 구축했으며 과장으로 특진했습니다.

      - layout: left
        title: SPC 이상현상 알림 시스템 개발
        sub_title: ILJIN Global
        caption: 2015.09
        quote: VB6, Oracle PL/SQL, TCP Socket
        description: |
          TCP 소켓 기반 설비 연동 모듈을 단독으로 설계·개발했습니다.
          일평균 100만 건의 생산 데이터를 분석해 7가지 이상 징후를 감지하고 SMS와 현황판으로 알리도록 구현했습니다.

