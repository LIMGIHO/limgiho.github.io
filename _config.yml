        link_text: 스토어 링크
        link2: https://merbl-filter.vercel.app/posts
        link2_text: 웹 버전
        description: |
          댓글 필터 앱과 웹 버전을 혼자 기획·개발·배포했습니다.
          웹에서는 Transformers.js와 WebLLM을 Web Worker로 실행해 브라우저 안에서 댓글을 분류하고 본문을 요약합니다.
          [개발 과정 보기](https://velog.io/@lasid84/commentfilter-1)

      - layout: left
