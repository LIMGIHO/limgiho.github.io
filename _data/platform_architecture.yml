- id: local-llm
  label: 로컬 LLM
  tech: 사내망 추론 서버 · 문서 추출 · OCR
  kind: infra
  boundary: integration-data
  summary: 문서 추출을 사내망 안에서 처리
  implementation: 추론 서버를 사내망 장비에 띄우고 HTTP로 호출합니다. 고객사 문서라 망 밖으로 나갈 수 없어 외부 API를 쓰지 않았습니다. JSON Schema로 LLM 출력 구조를
    지정하고, 일부 추출 항목을 정규식과 업무 규칙으로 확인·보정합니다. 서류 간 누락과 불일치는 별도의 업무 규칙으로 검사합니다.
  structure: '텍스트 레이어 판정

    · 스캔본 OCR(전체 페이지 → 표 영역 재인식)

    · JSON 응답 파싱 · 반복 추출 테스트'
  operation: PDF에 텍스트 레이어가 있으면 그대로 읽고, 스캔본만 OCR로 처리합니다. 렌더 해상도는 실물 문서로 반복 측정해 정했습니다. 300dpi에서 나던 오인식이 400dpi에서 사라졌고
    처리 시간은 거의 같았습니다.
  inputs: 수출입 문서 · 추출 스키마
  outputs: 검증된 구조화 데이터 · 실패 사유
  contract: Internal HTTP · JSON Schema
  deployment: 사내망 추론 서버 독립 운영
  x: 330
  y: 470
  width: 185
  height: 100
- id: data
  label: PostgreSQL
  tech: 업무 데이터 · 작업 기록
  kind: infra
  boundary: integration-data
  summary: 전달 상태와 업무 상태를 구분해 저장
  implementation: 기존 작업 테이블의 jobId와 payload를 전달 기록으로 활용하는 설계입니다. 전달 상태(미전달/전달 확인)와 업무 상태(PENDING/RUNNING/DONE/FAILED)를
    별도로 관리합니다. 업무 변경과 전달 의도를 함께 저장해야 하는 경우 동일 트랜잭션으로 커밋합니다.
  structure: 't_batch_job_m: jobId · payload · 전달 상태 · 업무 상태 · 결과'
  operation: 미전달 작업은 Relay가 다시 조회합니다. DONE은 재실행하지 않으며, 장기 RUNNING과 외부 결과 미확정 작업은 별도 복구·확인 대상으로 관리합니다.
  inputs: API 업무·작업 저장 · Relay 전달 기록 조회·갱신
  outputs: 미전달 작업 · 업무 상태 · 저장된 결과
  contract: SQL · 트랜잭션 경계
  x: 535
  y: 470
  width: 175
  height: 100
- id: queue
  label: BullMQ
  tech: Redis · 동일 jobId
  icon: redis
  icon_caption: Redis
  kind: infra
  boundary: queue-infra
  summary: 같은 큐에 같은 jobId가 남아 있는 동안 중복 등록 억제
  selection_reason: 3명이 화면·API·배치를 모두 개발하고 운영해야 했습니다. 기존 Node.js·Redis 환경에 맞고, 재시도와 동시 실행 제어 기능을 제공하는 BullMQ를 선택해 큐 처리 기능을 직접 구현하고 관리하는 부담을 줄였습니다.
  implementation: Relay가 DB jobId를 그대로 BullMQ jobId로 사용합니다. 큐 등록 후 DB 전달 완료 기록 전에 중단되면 같은 ID로 재등록합니다. 큐에 해당 작업이
    남아 있으면 새 작업은 추가되지 않습니다.
  structure: queue-names · job type/status/mode · typed payload · cron catalog 생성 스크립트
  operation: 완료 작업이 삭제되면 같은 ID로 다시 등록될 수 있으므로, 업무 API에서도 완료 상태를 확인합니다. 전달 확인은 업무 성공을 의미하지 않습니다.
  inputs: Relay의 queue.add · 공용 작업 계약
  outputs: Consumer에 전달되는 작업 · 재시도 · 큐 상태
  contract: 공용 작업 계약 패키지 · typed payload
  deployment: Redis 인프라 독립 운영
  x: 795
  y: 510
  width: 150
  height: 100
- id: relay
  label: Outbox Relay
  tech: DB 조회 → 큐 등록
  kind: app
  boundary: worker-project
  x: 795
  y: 300
  width: 170
  height: 100
  summary: DB에 남은 미전달 작업을 큐에 전달
  implementation: FOR UPDATE SKIP LOCKED로 미전달 행을 잠그고, 같은 jobId로 큐 등록 후 전달 상태를 갱신해 커밋합니다. 큐 등록 중에는 DB 트랜잭션을 유지합니다.
    업무 완료까지 기다리지는 않습니다.
  structure: polling service · 전달 기록 repository · queue publisher
  operation: 중간 종료로 DB 변경이 롤백되면 다음 조회에서 다시 처리합니다. DONE이 확인되면 재등록 없이 전달 기록만 정리합니다. Redis 대기 시간과 트랜잭션 시간을 제한하고, 오류·미전달
    대기 시간을 관측합니다.
  inputs: DB 미전달 작업 · 기존 jobId와 payload
  outputs: BullMQ 등록 · DB 전달 확인 기록
  contract: 동일 큐·동일 jobId · 행 잠금 · 전달 상태와 업무 상태 분리
  deployment: Consumer와 같은 Worker 프로젝트
  rationale: API의 DB 저장과 Redis 등록 사이에서 프로세스가 종료돼도 전달할 작업을 DB에서 다시 찾도록 합니다. 중복 전달 가능성은 API의 완료 확인과 업무별 멱등 처리로 다룹니다.
- id: worker
  label: Consumer
  tech: BullMQ → 내부 API
  icon: nestjs
  icon_caption: NestJS
  kind: app
  boundary: worker-project
  summary: 업무 API의 완료 기록을 확인한 뒤 큐 처리 종료
  implementation: 큐 작업을 받아 인증된 내부 API를 호출합니다. 업무 로직은 API에 두고, API가 DB에 결과와 DONE을 커밋한 뒤 성공 응답을 보내면 Processor를 정상
    반환합니다. 완료 저장을 completed 이벤트에만 맡기지 않습니다.
  structure: queue consumer · internal API client · scheduler trigger
  rationale: 전달과 실행의 역할을 구분하면서 기존 Worker 프로젝트를 유지합니다. Relay만 전달 기록에 접근하고, Consumer는 업무 로직을 API에 위임합니다.
  operation: DB 완료 후 API 응답이 유실되면 재호출 시 저장된 결과를 반환합니다. RUNNING 회수와 외부 결과 미확정 복구는 업무별로 정하며, 단순 시간 초과만으로 재실행하지 않습니다.
  inputs: BullMQ 작업 · 예약 실행
  outputs: 내부 API 호출 · 완료 커밋 확인 후 큐 정상 종료
  contract: 공용 작업 계약 패키지 · 단기 인증 토큰
  deployment: Relay와 같은 Worker 프로젝트 · 역할별 서비스
  x: 995
  y: 300
  width: 165
  height: 100
