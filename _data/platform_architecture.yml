- id: external
  label: 외부 시스템 8종
  tech: EDI 전문 · 저울 TCP 소켓 · FTP · 스케줄 수집
  kind: boundary
  boundary: external-systems
  summary: 플랫폼 밖에서 연동하는 시스템 8종
  implementation: 요청·수집·수신 세 방향이고 프로토콜이 제각각이라 하나로 억지 추상화하지 않았습니다. 전문 형식과 응답 규칙은 상대 시스템이 정하고 플랫폼이 거기 맞춥니다. 본사 운영
    시스템만은 연동 규격을 문서로 받을 수 없어, 화면이 주고받던 요청을 뜯어 직접 알아냈습니다.
  structure: "요청형 EDI 전송\n· 수집형 스케줄러\n  (환율·선사·항구·운임 마스터, 공휴일, 요율)\n· TCP 클라이언트로 저울 데이터 수집\n· 파일 교환\n· 본사 운영 시스템\
    \ 화면 호출 재현"
  inputs: 플랫폼 요청 · 스케줄 수집
  outputs: 전문 응답 · 마스터 데이터 · 저울 측정값
  contract: EDI 810 전문 형식 · 소켓 프로토콜 · 파일 규격 · 직접 알아낸 HTTP 호출 규격
  x: 48
