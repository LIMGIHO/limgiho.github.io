- id: web
  label: Web
  tech: Next.js · React · TypeScript
  icon: nextjs
  icon_caption: Next.js
  kind: app
  boundary: presentation
  summary: 5개 업무 도메인의 90여 개 화면
  implementation: 화면 단위 로컬 슬라이스와 공통 도메인 슬라이스를 분리하고, 서버 상태와 화면 상태의 책임을 나눴습니다. 기능이 많은 화면은 그 안에서 기능별로 다시 나눴습니다.
  structure: '<도메인 화면>/

    ├─ _container/       화면 조합 · 상태 연결

    ├─ _features/        업무 기능 묶음

    │  └─ <기능>/

    │     ├─ container/  기능 상태 · 이벤트

    │     ├─ view/       기능 표현

    │     └─ hooks/      기능별 훅

    ├─ _hooks/           화면 공통 훅

    └─ _store/           화면 상태'
  structure_type: tree
  rationale: 프론트도 경계가 나뉘어 있지 않아 한 곳을 고치면 다른 화면이 깨졌습니다. API와 같은 방식으로 클린 아키텍처를 옮겨보려 했지만 상태 관리와 훅이 레이어 구분에 얹히지 않았습니다.
    여러 구성을 시험한 끝에 기능 슬라이스로 나누는 FSD로 정리했습니다.
  operation: 화면과 기능이 폴더 단위로 갈려 있어 수정 범위가 그 폴더 안에 머뭅니다.
  inputs: 사용자 입력 · 조회 조건 · 첨부 문서
