nodes:
- id: api
  label: API
  tech: NestJS · TypeScript
  icon: nestjs
  icon_caption: NestJS
  kind: app
  boundary: application
  summary: 업무 로직 실행과 DB 완료 기록을 담당
  implementation: 사용자 요청과 Consumer의 내부 호출이 같은 도메인 서비스를 사용합니다. 업무 변경과 작업 생성이 함께 필요한 요청은 같은 DB 트랜잭션에 저장합니다. 작업 실행
    시 완료 여부와 실행 권한을 확인하고, 결과와 DONE을 저장한 뒤 성공 응답을 반환합니다.
  structure: "<모듈>/\n├─ adapter/\n│  ├─ controller/          HTTP 진입\n│  └─ dto/\n├─ application/\n│  └─ usecase/\n\
    │     └─ <유스케이스>/\n│        ├─ *.usecase.ts   업무 기능 하나\n│        ├─ dto.ts\n│        └─ mapper.ts\n└─ infra/\n\
    \   └─ repository/          읽기 · 쓰기 분리"
  structure_type: tree
  rationale: 초기 API는 Express로 자유도 높게 만들었고, 경계가 나뉘어 있지 않아 한 곳을 고치면 다른 곳이 깨졌습니다. NestJS와 클린 아키텍처를 도입해 모듈마다 방향을 고정했습니다.
  writeup:
    label: 이틀 동안 운영 API가 다섯 번 죽었다
    url: https://velog.io/@lasid84/nodejs-oom-postmortem
  operation: 내부 DB 작업은 업무 변경과 완료 기록을 같은 트랜잭션에 묶습니다. 본사 처리 성공 후 응답이 유실된 경우에는 외부 결과를 확인하며, 확인할 수 없는 작업을 무조건 다시 실행하지
    않습니다.
  inputs: Web·PDA REST 요청 · Worker 내부 배치 실행 요청
  outputs: 업무 데이터 · 전달할 작업 · 완료 상태와 결과 · 외부 연동
  contract: DTO · 작업 식별 키 · 실행 권한 · 단기 인증 토큰
  deployment: API 컨테이너 수평 확장
  x: 530
  y: 250
  width: 180
  height: 100
