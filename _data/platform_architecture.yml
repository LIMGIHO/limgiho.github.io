description: Web·PDA 요청은 API가 처리합니다. API는 DB에 전달할 작업을 기록하고, Worker 프로젝트의 Relay가 이를 큐에 넣습니다. 같은 프로젝트의 Consumer는 큐
  작업을 받아 API를 호출합니다. DB 업무 완료를 기록한 뒤 큐 처리를 끝내는 목표 구조입니다.
