source_date: "2026-10-09"
source_document: 경력기술서_20260913 (4).pdf
role: 백엔드 개발자
pdf_url: /assets/resume/lim-giho-resume-20260913.pdf
about: |
  <p class="hero-kicker">반복 업무를 자동화하는 시스템을 만들고 운영해 온 백엔드 개발자 임기호입니다.</p>

  제조·물류 현장에서 Node.js와 C#으로 서버를 개발하며, 여러 시스템에 흩어진 데이터와 업무 흐름을 연결해 왔습니다.

  현재는 본인 포함 3인 개발팀의 전체 설계와 개발을 리드합니다. 매주 코드 리뷰를 진행하고 개발 기준을 정립하며,
  외부 시스템 연동, Node.js 장애 분석, 비동기 처리와 배포 체계를 개선하고 있습니다.

content:
  - title: 경력
    content:
      - title: KWE Korea
        sub_title: 디지털솔루션부 차장 (Lead Software Engineer)
        caption: 2022.01 ~ 현재
        link: https://www.kwe.com/
        link_text: www.kwe.com
        quote: 국제 종합 물류 기업
        description: |
          항공·해운·재무 업무를 다루는 사내 시스템의 설계·개발·운영을 리드합니다.
          3인 개발팀에서 주간 코드 리뷰와 개발 기준 정립을 담당합니다.

          - 외부 시스템 연동의 전체 구조를 설계하고 동료와 기능을 나눠 분석·구현했습니다.
          - API/Worker 실행 구조와 CI/CD를 단독으로 구성했습니다.
          - 현업과 데이터 기준을 정리하고 운영 장애의 원인을 분석해 개선했습니다.
      - title: ILJIN Global
        sub_title: MES 개발팀 과장 (Software Engineer)
        caption: 2010.12 ~ 2022.01
        link: https://www.iljin.com/
        link_text: www.iljin.com
        quote: 베어링 제조 기업
        description: |
          생산관리시스템(MES)을 개발하고 운영했습니다. 국내외 공장의 MES 리뉴얼,
          SAP 연동, 생산·납품·재고 데이터 처리와 설비 알림 시스템을 담당했습니다.

  - title: 최근 주요 프로젝트
    content:
      - title: 통관 서류 검증 자동화
        sub_title: KWE Korea
        caption: 2026.06 ~ 2026.08
        responsibility: 문서 검증·입력·회신 업무 자동화 개발
        quote: Local LLM, OCR(Tesseract), Vitest
        description: |
          미국·중국 통관 서류 9종의 55개 항목을 담당자가 수작업으로 대조하고 있어,
          서류 간 누락과 불일치를 자동으로 확인하는 검증 시스템을 개발했습니다.

          업체마다 다른 양식과 스캔본·엑셀·PDF를 처리하기 위해 문서 내용을 의미적으로 분석하는 데 LLM을 활용했습니다.

          - 통관 서류 9종의 55개 대조 항목에서 누락과 불일치를 자동 탐지했습니다.
          - 문서에서 추출한 데이터의 시스템 입력부터 회신 메일 생성·첨부까지 연결했습니다.
          - 건당 서류 검토 시간을 **8분에서 3분**으로 줄여 **월 100건 기준 약 8.3시간을 절감**했습니다.
      - title: 웹 기반 통합 사내 시스템 구축
        sub_title: KWE Korea
        caption: 2023.09 ~ 2026.07
        responsibility: 전체 설계·개발 리드, 현업과 기준정보 정제
        quote: Express, Next.js, Turborepo, PostgreSQL, PL/pgSQL, PM2, Worker Threads
        description: |
          항공·해운·재무 업무가 15종 이상의 개별 프로그램과 서로 다른 데이터베이스에 분산돼 있었습니다.
          업무 단계마다 데이터 기준이 달라 같은 정보를 반복 입력하거나 수기로 대조해야 했으며,
          시스템별 기술 스택이 달라 유지보수와 기능 확장에도 시간이 필요했습니다.

          - **15종 이상의 개별 시스템**을 항공·해운 수출입 및 재무 중심의 단일 웹 플랫폼으로 통합했습니다.
          - 5개 업무부가 개별 관리하던 거래처 정보 약 3만 건을 현업과 검토·정제하고 글로벌 코드 기준으로 통합했습니다.
          - 관세청 API와 스크래핑을 연동해 건당 약 10분 걸리던 조회를 **5초 이내**로 줄였습니다.
          - C# 기반 입력 자동화를 웹 플랫폼으로 통합하고, 공용 라이브러리로 중복 코드를 정리했습니다.

          이후 NestJS로 백엔드를 전환하고 컨테이너 기반 배포 체계를 구축했습니다.
      - title: 글로벌 업무 시스템 연동 자동화
        sub_title: KWE Korea · 통합 플랫폼 개선 사례
        caption: 통합 플랫폼 구축·운영 중 개선
        responsibility: 전체 구조 설계, 동료 1명과 외부 호출 75개 공동 분석·구현
        quote: Node.js, TypeScript, HTTP, Puppeteer, Redis, PostgreSQL
        description: |
          해외 본사의 글로벌 업무 시스템에서 하루 약 **800~900건의 운송장** 정보를 반복 확인하고 입력하는 업무를 자동화했습니다.
          기존 Puppeteer 방식은 업무 데이터 외에 화면 자원까지 불러와 네트워크 부담이 컸습니다.

          - 인증 과정과 요청 순서, 입력·응답 형식을 분석해 **75개 외부 호출을 12종의 업무 흐름**으로 구성하고 HTTP로 직접 호출하도록 바꿨습니다.
          - 두 백엔드 컨테이너가 **Redis에 저장한 세션을 공유**하도록 구성했습니다. 인증 락을 획득한 뒤 세션을 다시 확인해 다른 요청이 갱신한 세션을 재사용했습니다.
          - 사용자 요청과 자동 배치에서 같은 인증 처리와 업무 API를 재사용하도록 구성했습니다.
          - 전환 후 운영에서 관측한 네트워크 사용량은 **60~70Mbps에서 대체로 5Mbps 미만**으로 줄었습니다.
      - title: Node.js API 서버 메모리 장애 개선
        sub_title: KWE Korea · 통합 플랫폼 개선 사례
        caption: 2026.08
        responsibility: 3인 공동 장애 분석, 원인 규명과 후속 검증 담당
        quote: Node.js, V8, Prisma, PostgreSQL, 메모리 계측
        additional_links:
          - title: OOM 분석 회고
            url: https://velog.io/@lasid84/nodejs-oom-postmortem
        description: |
          운영 중인 Node.js API 서버가 메모리 부족으로 반복 종료됐습니다.
          OCR 처리와 Prisma 쿼리 엔진을 의심했지만 관련 조치 후에도 장애가 이어져
          로그와 실제 배포 버전, 조회 조건을 다시 확인했습니다.

          - 기간 조건에 해당하는 데이터를 **수만 건씩 한 번에 조회하고 응답으로 가공**하는 경로를 찾았습니다.
          - 요청당 처리량을 줄이기 위해 **500건 단위 조회와 무한스크롤**을 적용했습니다.
          - 별도 응답 처리 모사 실험으로 힙과 RSS를 반복 측정했습니다. GC 이후 힙이 계속 누적되는 패턴은 확인되지 않았고 조회 결과를 가공·직렬화하는 동안 메모리 사용량이 증가했습니다.
          - 적용 후 **서버 전체 메모리 사용률은 30~40%**로 안정됐고 해당 메모리 장애는 재발하지 않았습니다.
      - title: Docker Swarm 기반 CI/CD 표준 배포 체계 구축
        sub_title: KWE Korea
        caption: 2025.11 ~ 2025.12
        responsibility: CI/CD 설계·구축 및 후속 개선 단독 수행
        quote: GitLab CI/CD, Docker, Docker Swarm, Portainer
        description: |
          기존 PM2 중심의 수동 배포는 서버 상태와 환경 차이에 따라 결과 재현이 어려웠고,
          테스트 누락 방지와 배포 이력 추적·롤백 기준도 미흡했습니다.

          - 테스트 → 빌드 → 배포 파이프라인을 구성하고 테스트 실패 시 후속 단계를 차단했습니다.
          - 브랜치·SHA 태그와 디제스트로 이미지를 식별해 동일 이미지를 다시 배포할 수 있도록 했습니다.
          - 빌드·배포 로그와 아티팩트로 변경 이력과 실패 원인을 추적했습니다.
          - Portainer에서 서비스·태스크 상태와 로그, 재시작 반복 및 헬스 체크 실패를 확인했습니다.

          2026년 9월에는 buildx로 전환하고 러너·캐시 설정을 정비했습니다.
          앱별 잡을 한 파이프라인에 모으고 변경 경로에 따라 실행하도록 구성했습니다.
          API 단위 테스트 잡의 실행 시간은 개선 전후 로그 기준 **3분 27초에서 2분 25초**로 줄었습니다.
      - title: 백엔드 서비스 리팩토링(Express → NestJS)
        sub_title: KWE Korea
        caption: 2025.06 ~ 2025.10
        responsibility: 도메인 구조 정리·팀 개발 기준 정립, API/Worker 구조 단독 설계
        quote: Node.js, NestJS, Prisma, PostgreSQL, Redis, BullMQ
        description: |
          기능이 늘면서 모듈 간 의존성이 복잡해지고 일관된 코드 구조 유지와 단위 테스트 적용이 어려워졌습니다.
          NestJS로 전환하며 도메인별 모듈과 의존성을 정리하고, 팀 코드 컨벤션과 TDD 기반 개발 환경을 구축했습니다.

          - 코드베이스를 도메인별 모듈로 나눠 신규 기능 개발과 유지보수에 필요한 구조를 정리했습니다.
          - Redis와 BullMQ로 무거운 작업을 비동기 배치 파이프라인으로 분리하고, 인증 데이터를 캐싱해 DB 부하를 줄였습니다.
          - DI와 데코레이터 등 NestJS 구조를 도입해 인증·로깅 등 공통 로직을 재사용하도록 했습니다.
          - 단위·통합 테스트로 변경 영향 범위를 사전에 검증할 수 있는 구조를 마련했습니다.

          업무 로직은 API에서 실행하고 Worker는 큐의 작업을 받아 API를 호출한 뒤 HTTP 응답을 기다리도록 설계했습니다.
          DB에 작업 상태를 기록해 종료된 작업은 건너뛰고 Redis 실행 락으로 동시 실행을 제어했습니다.
      - title: RPA 프로젝트 (삼성 NERP 연동)
        sub_title: KWE Korea
        caption: 2024.08 ~ 2024.12
        responsibility: 문서 검증·데이터 입력 자동화 개발
        quote: C# (.NET 4.5), WinForms, OCR, MySQL
        description: |
          삼성 시스템의 데이터 입력 작업에 시간이 많이 소요되어 업무팀의 야근이 빈번하게 발생했습니다.
          문서 검증과 입력 과정을 자동화했습니다.

          - 문서 검증·입력 자동화로 **월 1,200시간을 절감**했습니다(기존 경력기술서 산정치).
          - 실시간 처리로 입력 누락과 오입력 가능성을 줄였습니다.
      - title: 세금계산서 프로그램 리뉴얼
        sub_title: KWE Korea
        caption: 2023.01 ~ 2023.07
        responsibility: 업무 로직 재구현·DB 전환·데이터 이관 및 검증
        quote: C# (.NET 6), gRPC, WinForms, PostgreSQL, PL/pgSQL
        description: |
          Oracle Forms 버전의 기술지원 종료로 유지보수가 어려워졌고,
          Oracle 라이선스 비용과 확장 제약을 줄이기 위해 .NET 6 기반 리뉴얼과 PostgreSQL 전환을 추진했습니다.

          - Oracle Forms 기반 세금계산서 업무 로직 전체를 PL/pgSQL로 재구현했습니다.
          - Oracle에서 PostgreSQL로 전환해 라이선스 비용을 줄였습니다.
          - **1,000만 건의 데이터 이관을 자동화**하고 정합성을 검증했습니다.
          - 스마트빌 연동으로 국세청 즉시 신고 및 매입 데이터를 실시간으로 처리했습니다.

  - title: 제조·MES 프로젝트
    content:
      - title: 운반비 전산화 구축
        sub_title: ILJIN Global
        caption: 2020.04 ~ 2020.07
        responsibility: 운반비 업무 전산화·SAP 연동 개발
        quote: C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle, PL/SQL
        description: |
          수기 작성·수작업 중심의 운반비 관리를 전산화했습니다.

          - 8개 공장의 운반비 프로세스를 전산화해 수작업을 줄이고 처리 절차를 통일했습니다.
          - SAP 연동으로 운반비를 실시간으로 처리하고 비용 투명성을 확보했습니다.
          - 최우수사원 표창을 받았습니다.
      - title: MES - SAP 연동 인터페이스 개발
        sub_title: ILJIN Global
        caption: 2019.01 ~ 2019.12
        responsibility: MES·SAP 실적 및 기준정보 인터페이스 개발
        quote: C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle, PL/SQL
        description: |
          생산·납품·재고 정보를 수작업으로 전송하고 중복 입력하면서 생기는 지연과 오류 가능성을 줄이기 위해 실시간 연동 인터페이스를 개발했습니다.

          - ERP(SAP)와 MES 사이의 생산·납품·재고 이동 데이터를 실시간으로 연동했습니다.
          - 기준정보를 자동 이관해 운영 오류와 수작업을 줄였습니다.
      - title: 제천·슬로바키아 공장 MES 업그레이드
        sub_title: ILJIN Global
        caption: 2016.04 ~ 2017.12
        responsibility: 국내외 공장 MES 리뉴얼·LOT 추적 시스템 개발
        quote: VB6 → C# (.NET 4.5), ASP.NET, WinForms, WCF, Oracle 9i → 11g, PL/SQL
        description: |
          VB6 기반 MES의 기술지원 종료와 컴포넌트·개발 환경 제약을 해결하기 위해 C# 기반 리뉴얼과 데이터베이스 업그레이드를 수행했습니다.

          - 제천·슬로바키아 공장의 MES를 리뉴얼했습니다.
          - LOT 단위 추적 시스템을 구축해 품질 관리 프로세스를 개선했습니다.
          - 과장으로 특진했습니다.
      - title: SPC 이상현상 알림 시스템 개발
        sub_title: ILJIN Global
        caption: 2015.09
        responsibility: TCP 소켓 기반 설비 알림 모듈 단독 설계·개발
        quote: VB6, Oracle PL/SQL, TCP Socket
        description: |
          생산 품질 이슈를 실시간으로 감지하고 알리는 SPC 시스템을 구축했습니다.
          공정 설비와 연계하는 TCP 소켓 기반 알림 모듈을 단독으로 설계·개발했습니다.

          - 일평균 100만 건의 생산 데이터 환경에서 SQL로 7가지 이상 징후 판정 로직을 구현했습니다.
          - SMS와 현황판으로 알림을 전달했습니다.

  - title: 기술
    content:
      - title: 백엔드
        description: |
          Node.js, TypeScript, Express, NestJS, Prisma, Redis, BullMQ<br>
          C# (.NET Framework, .NET 6), gRPC, WCF

          물류 플랫폼의 Express·NestJS 서버, Redis 기반 인증 조정과 BullMQ 배치 처리에 사용했습니다.
          C#은 제조 MES와 물류 업무 도구, gRPC·WCF는 시스템 간 연동에 사용했습니다.
      - title: 프론트엔드
        description: |
          Next.js, React, React Native, Expo, WinForms

          사내 웹 플랫폼과 개인 앱의 화면을 구현했습니다. WinForms로 제조·물류 업무 도구를 개발했습니다.
      - title: 데이터
        description: |
          PostgreSQL, Oracle, MySQL, PL/SQL, PL/pgSQL

          업무 로직과 인터페이스를 구현하고 Oracle → PostgreSQL 전환에서 1,000만 건을 이관·검증했습니다.
      - title: 배포·운영
        description: |
          GitLab CI/CD, Docker, Docker Swarm, buildx, Portainer, PM2, Turborepo

          초기 PM2 운영에서 컨테이너 배포로 전환하고 2026년 9월 빌드·러너·캐시를 개선했습니다.
      - title: 문서 처리·검증
        description: |
          Local LLM, Tesseract OCR, Vitest

          통관 문서의 누락·불일치 검증과 데이터 추출에 사용하고 단위·통합 테스트로 변경 영향을 확인했습니다.

