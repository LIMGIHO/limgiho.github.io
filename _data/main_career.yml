source_date: "2026-10-28"
source_document: 사용자 확인 사실관계 및 2026-10-28 지원서 v4
role: 백엔드 개발자
pdf_url: /assets/resume/lim-giho-resume-20260913.pdf
about: |
  <p class="hero-kicker">업무의 의미가 드러나고, 안심하고 바꿀 수 있는 코드를 지향합니다.</p>

  비슷해 보이는 코드라도 업무에서 맡는 책임과 변경 이유를 살펴 공통화합니다. 함께 바뀌어야 하는 것은 모으고, 업무마다 달라지는 판단은 분리합니다.

  테스트로 기존 업무 동작이 유지되는지 확인하며 구조를 개선합니다. 운영 중 반복되는 문제와 변경하기 어려운 부분을 찾아, 팀이 이해하고 고쳐 나갈 수 있는 코드로 다듬습니다.

  문제를 해결할 때는 제 판단도 검증의 대상으로 둡니다. 예상과 실제 동작이 다르면 로그와 실행 환경을 다시 확인하고, 근거에 따라 판단을 바꿉니다.

content:
  - title: 경력
    content:
      - title: (주)케이더블유이코리아
        sub_title: 디지털솔루션부 차장 (Lead Software Engineer)
        caption: 2022.01 ~ 현재
        link: https://www.kwe.com/
        link_text: www.kwe.com
        quote: 국제 종합 물류 기업
        description: |
          항공·해운·재무 업무 시스템의 웹 플랫폼 통합을 완료하고 설계·개발·운영을 리드합니다.
          현재는 해운수입 업무의 신규 전산화를 진행하고 있습니다.
          3인 개발팀에서 주간 코드 리뷰와 개발 기준 정립을 담당합니다.

          - 외부 시스템 연동의 전체 구조를 설계하고 동료와 기능을 나눠 분석·구현했습니다.
          - API/Worker 실행 구조와 CI/CD를 단독으로 구성했습니다.
          - 현업과 데이터 기준을 정리하고 운영 장애의 원인을 분석해 개선했습니다.
      - title: ILJIN Global
        sub_title: MES 개발팀 과장 (Software Engineer)
        caption: 2010.12 ~ 2022.01
        link: https://www.iljin.com/
        link_text: www.iljin.com
        quote: 베어링 제조 기업
        description: |
          생산관리시스템(MES)을 개발하고 운영했습니다. 국내외 공장의 MES 리뉴얼,
          SAP 연동, 생산·납품·재고 데이터 처리와 설비 알림 시스템을 담당했습니다.

          **사내 평가·포상:** 2017년 과장 조기 진급 · 2020년 우수사원 선정

  - title: 최근 주요 프로젝트
    content:
      - title: 통관 서류 검증 자동화
        sub_title: (주)케이더블유이코리아
        caption: 2026.06 ~ 2026.09
        responsibility: 문서 검증·선적서 작성·프리알럿 자동화 개발
        quote: Local LLM, OCR(Tesseract), Vitest
        description: |
          반도체 업황에 따라 월 100~600건의 통관 업무가 발생하며 담당자마다 확인 항목과 판단 기준이 달랐습니다.
          현업과 실제 검토 사례를 확인해 서류 9종의 55개 대조 항목을 정리하고, 인보이스와 발주서의 수량 일치 등 20개 업무 규칙으로 표준화했습니다.

          업체마다 다른 양식에 대응하기 위해 문서별 추출 항목의 설명과 few-shot 예시를 설정으로 관리했습니다.
          파일 형식별 데이터 추출과 LLM 호출을 분리하고, 추출한 텍스트를 문서별 설정과 함께 LLM에 전달해 필요한 항목을 구조화했습니다.

          추출과 업무 규칙 검증을 분리하고 추출값을 20개 업무 규칙으로 자동 검증했습니다.
          검증에 실패한 사례와 처리 오류를 기록·분석해 추출 설정과 검증 로직을 개선했습니다.

          - 통관 서류 **9종의 55개 대조 항목**에서 누락과 불일치를 자동 탐지했습니다.
          - 현업 확인 기준 **통관 1건당 서류 검토 시간을 8분에서 3분**으로 줄였습니다.
          - 인보이스·발주서·FDA 관련 서류의 추출값으로 선적서를 작성하고, 프리알럿 메일 작성·관련 서류 첨부까지 자동화해 **후속 업무에서 하루 약 1시간을 추가 절감**했습니다.
      - title: 웹 기반 통합 사내 시스템 구축
        sub_title: (주)케이더블유이코리아
        caption: 2023.09 ~ 2026.08
        responsibility: 전체 설계·개발 리드, 현업과 기준정보 정제
        quote: Express → NestJS, Next.js, Turborepo, PostgreSQL, PL/pgSQL
        description: |
          입사 당시 핵심 담당자 두 명이 이탈한 상태에서, 여러 언어와 기술로 개발된 100개 이상의 프로그램 소스코드를 인계받았습니다.
          시스템이 나뉘어 있어 개선 요청을 반영하기 어려웠고, 운영 문제는 데이터 패치로 대응하는 경우가 많았습니다.
          특정 담당자가 없어도 팀이 시스템을 이해하고 개선을 이어갈 수 있도록 웹 플랫폼 통합을 추진했습니다.

          - **15종 이상의 업무 시스템**을 하나의 웹 플랫폼으로 통합했습니다. 한 부서의 요청으로 개발한 본사 시스템 연동과 관세청 조회 기능을 다른 부서에도 적용해, 같은 기능을 부서마다 새로 개발할 필요를 줄였습니다.
          - 5개 업무부가 개별 관리하던 거래처 정보 약 3만 건을 현업과 검토·정제했습니다. 같은 사업자번호라도 공장별로 거래처를 구분하는 예외를 확인하고, 기존 글로벌 코드 매핑 자료를 대조해 공통 식별 기준을 마련했습니다.
          - 관세청 UNI-PASS Open API로 통관 상태 변화를 확인하고, 입항보고 수리 등의 마일스톤을 본사 시스템에 입력하도록 연동했습니다. 두 시스템을 오가던 확인·입력 시간을 **건당 약 10분에서 약 5초**로 줄였습니다.
          - C# 기반 입력 자동화를 웹 플랫폼으로 통합하고, 공용 라이브러리로 중복 코드를 정리했습니다.

          그룹웨어 결재로 개선 요청을 접수하고 검토 후 개발에 반영하는 절차를 마련했습니다.
          개별 데이터를 직접 수정하던 대응에서 프로그램을 개선하는 방식으로 운영을 바꿨습니다.

          통합 과정에서 NestJS로 백엔드를 전환하고 컨테이너 기반 배포 체계를 구축했습니다.
      - title: 본사 시스템 연동 방식 전환과 처리 결과 검증
        sub_title: (주)케이더블유이코리아 · 통합 플랫폼 개선 사례
        caption: 2025.06 ~ 2025.10
        responsibility: 전체 구조 설계, 동료 1명과 외부 호출 75개 공동 분석·구현
        quote: Node.js, TypeScript, HTTP, Puppeteer, Redis, PostgreSQL
        additional_links:
          - title: 기존 자동화 효과 산정 근거
            url: https://velog.io/@lasid84/RPA프로젝트구축
        description: |
          하루 약 **800~900건의 운송장** 정보를 내부 시스템과 해외 본사 업무 시스템에 반복 입력하던 업무를 Puppeteer로 자동화했습니다.
          이 기존 자동화의 효과는 당시 부서별 처리량과 작업 시간을 기준으로 **월 약 1,200시간으로 추산**했습니다.
          다만 화면 자원 로딩이 **100Mbps 사내 회선의 60~70Mbps를 점유**해, 화면을 불러오지 않고 업무 데이터만 주고받는 HTTP 연동으로 전환했습니다.

          - 본사 웹 화면의 HTTP 요청·응답과 인증 과정을 분석하고, 브라우저가 보내던 요청을 Node.js·TypeScript 코드로 재현했습니다. 총 **75개 HTTP 요청을 구현해 비용 등록·운임 확인·마감 처리 등 12종 업무 흐름**을 전환했습니다.
          - 운송장 데이터의 **400개 이상 필드**를 분석하고, 요청 구성과 응답 해석 로직을 여러 업무에서 재사용하도록 만들었습니다.
          - 직접 구성한 요청의 처리 결과와 실제 화면 입력 후 계산된 결과를 각각 저장하고 비교해, 기존 업무와 같은 결과가 나오는지 확인했습니다.
          - 두 백엔드 컨테이너가 **Redis에 저장한 세션을 공유**하도록 구성했습니다. 인증 락을 획득한 뒤 세션을 다시 확인해 다른 요청이 갱신한 세션을 재사용했습니다.
          - 사용자 요청과 자동 배치에서 같은 인증 처리와 업무 API를 재사용하도록 구성했습니다.
          - 전환 후 운영에서 관측한 네트워크 사용량은 **60~70Mbps에서 대체로 5Mbps 미만**으로 줄었습니다.
      - title: 호출 기록 분석과 반복 조회 개선
        sub_title: (주)케이더블유이코리아 · 통합 플랫폼 개선 사례
        caption: "2026.10"
        responsibility: 호출 기록 분석·공통 조회 로직 개선
        quote: NestJS, React, Redis, PostgreSQL
        description: |
          항공수출 업무 화면에서 본사 시스템의 첨부 문서 목록과 운송장 템플릿을 조회하는 요청이 하루 약 7천 건 발생했습니다.
          요청·배치 작업·외부 호출의 ID를 연결한 기록으로 호출 경로를 추적했습니다.
          항공수출 업무 화면의 호출 내역을 분석해 문서·템플릿 검색이 약 94%를 차지하고,
          행 이동과 상세 화면 재조회 때 반복 실행되는 구조를 확인했습니다.

          - 여러 화면이 사용하는 공통 첨부 패널에 **0.5초 디바운스**를 적용해 연속 행 이동 시 마지막 대상만 조회하도록 했습니다. 최초 열기와 명시적 새로고침은 즉시 처리하고, 이전 대상의 늦은 응답은 제외했습니다.
          - 변경이 드문 템플릿은 **Redis에 1시간 캐시**했습니다. 빈 결과도 재사용하되 오류는 저장하지 않고, Redis 장애 시 본사 시스템을 직접 조회하도록 했습니다.
          - 적용 후 해당 항공수출 업무 화면의 **일일 본사 시스템 호출이 약 7천 건에서 5천 건으로 줄어, 약 29% 감소**했습니다.
      - title: Node.js API 서버 메모리 장애 개선
        sub_title: (주)케이더블유이코리아 · 통합 플랫폼 개선 사례
        caption: 2026.08
        responsibility: 메모리 장애 분석과 조회 구조 개선
        quote: Node.js, V8, Prisma, PostgreSQL, 메모리 계측
        additional_links:
          - title: OOM 분석 회고
            url: https://velog.io/@lasid84/nodejs-oom-postmortem
        description: |
          운영 중인 Node.js API 서버가 메모리 부족으로 반복 종료됐습니다.
          OCR 처리와 Prisma 쿼리 엔진을 의심했지만 관련 조치 후에도 장애가 이어져
          힙·RSS를 분석하고 로그와 실제 배포 버전, 조회 조건을 다시 확인했습니다.

          - 기간 조건에 해당하는 데이터를 **수만 건씩 한 번에 조회하고 응답으로 가공**하는 경로를 찾았습니다.
          - 요청당 처리량을 줄이기 위해 **500건 단위 조회와 무한스크롤**을 적용했습니다.
          - 조회 구조를 개선한 뒤, 응답 처리 과정을 별도로 모사해 객체 변환·JSON 직렬화·Buffer 생성 단계의 **힙 사용량(heapUsed)과 RSS**를 측정했습니다. 반복 실행에서도 GC 이후 힙 사용량은 누적되지 않았고 RSS는 초기 증가 이후 일정 범위에 수렴했습니다. 모사한 응답 처리 경로에서는 지속적인 누수 징후가 관측되지 않았습니다.
          - 조회 구조 개선 이후 동일 장애는 재발하지 않았습니다.
      - title: Docker Swarm 기반 CI/CD 표준 배포 체계 구축
        sub_title: (주)케이더블유이코리아
        caption: 2025.11 ~ 2025.12
        responsibility: CI/CD 설계·구축 및 후속 개선 단독 수행
        quote: GitLab CI/CD, Docker, Docker Swarm, Portainer
        description: |
          기존 PM2 중심의 수동 배포는 서버 상태와 환경 차이에 따라 결과 재현이 어려웠고,
          테스트 누락 방지와 배포 이력 추적·롤백 기준도 미흡했습니다.

          - 테스트 → 빌드 → 배포 파이프라인을 구성하고 테스트 실패 시 후속 단계를 차단했습니다.
          - 브랜치·SHA 태그와 디제스트로 이미지를 식별해 동일 이미지를 다시 배포할 수 있도록 했습니다.
          - 빌드·배포 로그와 아티팩트를 남겨 배포 이력과 실패 단계의 로그를 확인할 수 있도록 구성했습니다.
          - Portainer를 도입해 서비스·태스크 상태와 컨테이너 로그를 한곳에서 확인하는 모니터링 환경을 구축했습니다.

          2026년 9월에는 Kaniko에서 buildx로 전환하고 러너·캐시 구성을 개선했습니다.
          앱별 잡을 한 파이프라인에 모으고 변경 경로에 따라 실행하도록 구성했습니다.
          테스트·빌드·배포 전체 파이프라인 시간을 **약 12분에서 6분**으로 줄였습니다.
      - title: 백엔드 서비스 리팩토링(Express → NestJS)
        sub_title: (주)케이더블유이코리아
        caption: 2025.06 ~ 2025.10
        responsibility: 도메인 구조 정리·팀 개발 기준 정립, API/Worker 구조 단독 설계
        quote: Node.js, NestJS, Prisma, PostgreSQL, Redis, BullMQ
        description: |
          기능이 늘면서 모듈 간 의존성이 복잡해지고 일관된 코드 구조 유지와 단위 테스트 적용이 어려워졌습니다.
          NestJS로 전환하며 도메인별 모듈과 의존성을 정리하고, 팀 코드 컨벤션과 TDD 기반 개발 환경을 구축했습니다.

          - 코드베이스를 도메인별 모듈로 나눠 신규 기능 개발과 유지보수에 필요한 구조를 정리했습니다.
          - Redis와 BullMQ로 무거운 작업을 비동기 배치 파이프라인으로 분리하고, 인증 데이터를 캐싱해 DB 부하를 줄였습니다.
          - DI와 데코레이터 등 NestJS 구조를 도입해 인증·로깅 등 공통 로직을 재사용하도록 했습니다.
          - 단위·통합 테스트로 변경 영향 범위를 사전에 검증할 수 있는 구조를 마련했습니다.

          업무 로직은 API에서 실행하고, BullMQ Worker는 작업 실행 요청과 재시도를 담당하도록 구성했습니다.

          같은 업무가 동시에 중복 등록되지 않도록 업무 식별 키별 PostgreSQL advisory lock을 획득하고,
          같은 트랜잭션에서 진행 중인 작업을 확인한 뒤 없을 때만 등록했습니다.

          작업별 재시도 횟수와 간격을 정하고, 재시도 대기와 최종 실패를 별도 상태로 기록했습니다.
          오류 원인과 요청 데이터를 남겨 지정한 작업을 다시 실행할 수 있도록 했습니다.
          등록 요청 시 DB에는 진행 중이지만 큐에는 없는 작업을 확인하면 기존 작업을 실패 처리하고 재등록하도록 했습니다.
      - title: RPA 프로젝트 (삼성 NERP 연동)
        sub_title: (주)케이더블유이코리아
        caption: 2024.08 ~ 2024.12
        responsibility: 문서 검증·데이터 입력 자동화 개발
        quote: C# (.NET 4.5), WinForms, OCR, MySQL
        description: |
          삼성 시스템의 데이터 입력 작업에 시간이 많이 소요되어 업무팀의 야근이 빈번하게 발생했습니다.
          문서 검증과 입력 과정을 자동화했습니다.

          - 실시간 처리로 입력 누락과 오입력 가능성을 줄였습니다.
      - title: 세금계산서 프로그램 리뉴얼
        sub_title: (주)케이더블유이코리아
        caption: 2023.01 ~ 2023.07
        responsibility: 업무 로직 재구현·DB 전환·데이터 이관 및 검증
        quote: C# (.NET 6), gRPC, WinForms, PostgreSQL, PL/pgSQL
        description: |
          Oracle Forms 버전의 기술지원 종료로 유지보수가 어려워졌고,
          Oracle 라이선스 비용과 확장 제약을 줄이기 위해 .NET 6 기반 리뉴얼과 PostgreSQL 전환을 추진했습니다.

          - Oracle Forms 기반 세금계산서 업무 로직 전체를 PL/pgSQL로 재구현했습니다.
          - Oracle에서 PostgreSQL로 전환해 라이선스 비용을 줄였습니다.
          - **1,000만 건의 데이터 이관을 자동화**하고 정합성을 검증했습니다.
          - 스마트빌 연동으로 국세청 즉시 신고 및 매입 데이터를 실시간으로 처리했습니다.

