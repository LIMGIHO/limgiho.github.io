        quote: VB6, Oracle PL/SQL, TCP Socket
        description: |
          생산 품질 이슈를 실시간으로 감지하고 알리는 SPC 시스템을 구축했습니다.
          공정 설비와 연계하는 TCP 소켓 기반 알림 모듈을 단독으로 설계·개발했습니다.

          - 일평균 100만 건의 생산 데이터 환경에서 SQL로 7가지 이상 징후 판정 로직을 구현했습니다.
          - SMS와 현황판으로 알림을 전달했습니다.

