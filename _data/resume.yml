        description: |
          Local LLM, Tesseract OCR, Vitest

  - title: 개인 프로젝트
    content:
      - title: 댓글 필터 (Android · Web)
        link: https://play.google.com/store/apps/details?id=com.giholim.commentfilter&hl=ko
        link_text: Google Play
        link2: https://merbl-filter.vercel.app/posts
        link2_text: 웹 버전
        quote: React Native, Expo, TypeScript, WebView, Next.js, Transformers.js, WebLLM, Web Worker
        description: |
          앱 기획부터 구현과 배포까지 혼자 수행했습니다.
          앱에서는 네이버 블로그 글을 WebView로 열어 온디바이스에서 댓글 가시성을 조절하고,
          좋아요 기준 필터와 차단 사용자 숨김 기능을 적용했습니다.

          Next.js 웹 버전에서는 Transformers.js와 WebLLM을 Web Worker로 구동해
          브라우저 온디바이스에서 댓글을 분류하고 본문을 요약합니다.

          [개발 과정 보기](https://velog.io/@lasid84/commentfilter-1)
      - title: HealthDog
        link: https://play.google.com/store/apps/details?id=com.healthdog.app
        link_text: Google Play
        quote: React Native, Expo, TypeScript, Google OAuth, Firebase, Supabase, AdMob, RevenueCat
        description: |
          운동 기록·조회·통계 기능 중심의 앱을 혼자 개발했습니다.
          Google OAuth 로그인, Supabase·Firebase 데이터 저장 및 동기화,
          AdMob 광고와 RevenueCat 구독 결제 등 운영에 필요한 외부 서비스를 연동했습니다.
      - title: "액션독: 3라인 퍼즐 (Android)"
        link: https://play.google.com/store/apps/details?id=com.giholim.actiondog
        link_text: Google Play
        quote: React Native, Expo, TypeScript, Google OAuth, Supabase, AdMob
        description: |
          3라인 매치 퍼즐 게임을 혼자 기획·개발하고 스토어에 출시했습니다.
          블록 하강·매치 판정·콤보 연쇄·게임오버 등 게임 코어 엔진을
          도메인 주도 아키텍처의 4계층으로 나눠 직접 설계·구현했습니다.

          Google OAuth 로그인, Supabase 기반 글로벌 점수 랭킹, AdMob 광고를 연동했습니다.
