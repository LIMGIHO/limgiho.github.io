daangn:
  theme: daangn
  theme_color: "#ff6f0f"
  stylesheet: /assets/css/daangn.css
  portfolio_url: /daangn/portfolio/
  about: |
    코드를 설계할 때는 중복을 줄이는 것보다 실제 업무의 의미와 책임이 잘 드러나는지를 중요하게 생각합니다. 비슷한 코드라도 업무에서 필요한 동작이 다르다면 무리하게 공통화하지 않습니다.

    기존 기능을 안전하게 변경할 수 있도록 테스트와 코드 리뷰를 중요하게 생각합니다. 정상 동작뿐 아니라 실패와 경계 조건을 확인하고, 변경에 따른 영향을 줄일 수 있는 구조를 고민합니다.

    운영 중 문제가 발생하면 처음 세운 가설에만 의존하지 않고, 로그와 실제 실행 환경을 다시 확인하며 원인을 찾으려고 합니다.
  excluded_projects:
    - RPA 프로젝트 (삼성 NERP 연동)
  hidden_subtitles:
    - KWE Korea
    - KWE Korea · 통합 플랫폼 개선 사례
  description_overrides:
    KWE Korea: |
      항공·해운 수출입과 재무 업무를 다루는 사내 통합 플랫폼을 개발하고 운영합니다. 현업과 함께 업무 절차와 데이터 기준을 정리하고, 해외 본사 시스템 연동과 반복 업무 자동화를 담당합니다.

      3인 개발팀에서 매주 코드 리뷰를 진행하며 구현 방식과 주요 변경 사항을 함께 검토합니다.
    통관 서류 검증 자동화: |
      미국·중국 통관 서류 9종의 55개 항목을 담당자가 수작업으로 대조하고 있어,
      서류 간 누락과 불일치를 자동으로 확인하는 검증 시스템을 개발했습니다.

      업체마다 다른 서류 양식과 DOC·DOCX·엑셀·PDF·스캔본 등 다양한 접수 형식을 처리하기 위해, 문서 내용을 해석하고 필요한 항목을 추출하는 데 LLM을 활용했습니다.

      - 통관 서류 9종의 55개 대조 항목에서 누락과 불일치를 자동 탐지했습니다.
      - 통관 1건의 서류 검토 시간을 **8분에서 3분**으로 줄였습니다.
      - 시스템 등록·관리와 회신 메일 작성·파일 첨부를 자동화해 **후속 업무에서 하루 약 1시간을 추가 절감**했습니다.
    웹 기반 통합 사내 시스템 구축: |
      항공·해운·재무 업무에는 15종 이상의 개별 시스템이 사용되고 있었고, 기능과 데이터도 여러 시스템에 나뉘어 있었습니다.
      업무 단계마다 데이터 기준이 달라 같은 정보를 반복 입력하거나 수기로 대조해야 했으며,
      시스템별 기술 스택이 달라 유지보수와 기능 확장에도 시간이 필요했습니다.

      - **15종 이상의 개별 시스템**을 항공·해운 수출입 및 재무 중심의 단일 웹 플랫폼으로 통합했습니다.
      - 5개 업무부가 개별 관리하던 거래처 정보 약 3만 건을 현업과 검토·정제하고 글로벌 코드 기준으로 통합했습니다.
      - 관세청 API와 스크래핑을 연동해 건당 약 10분 걸리던 조회를 **5초 이내**로 줄였습니다.
    Node.js API 서버 메모리 장애 개선: |
      운영 중인 Node.js API 서버가 메모리 부족으로 반복 종료됐습니다.
      OCR 처리와 Prisma 쿼리 엔진을 의심했지만 관련 조치 후에도 장애가 이어져
      로그와 실제 배포 버전, 조회 조건을 다시 확인했습니다.

      - 조회 건수에 제한이 없어 **수만 건의 데이터를 한 번에 불러와 응답으로 가공하는 구조**가 메모리 부족의 원인임을 확인했습니다.
      - 서버 API에 **500건 단위 페이지네이션**을 적용하고 화면을 무한스크롤로 전환해 요청당 처리하는 데이터양을 제한했습니다.
      - 개선 이후 응답 데이터의 가공·JSON 직렬화 과정을 별도로 모사해 **Heap·RSS와 GC 이후 메모리 변화**를 반복 측정했습니다. 처리 과정에서 메모리 사용량은 증가했지만, GC 이후 힙은 누적되지 않았고 RSS도 일정 범위에 수렴하는 것을 확인했습니다.
    Docker Swarm 기반 CI/CD 표준 배포 체계 구축: |
      기존 PM2 중심의 수동 배포는 서버 환경과 작업 방식에 따라 배포 결과가 달라질 수 있었고, 테스트와 배포 과정도 분리돼 있었습니다. 이를 개선하기 위해 Docker Swarm 기반으로 배포 환경을 전환하고 GitLab CI/CD 파이프라인을 구축했습니다.

      - 테스트 → 빌드 → 배포 과정을 자동화하고, 테스트 실패 시 후속 단계를 차단하도록 구성했습니다.
      - 이미지 태그와 디제스트로 배포 버전을 식별하고, Portainer에서 서비스·태스크 상태와 컨테이너 로그를 확인할 수 있도록 운영 환경을 정비했습니다.

      이후 Kaniko에서 buildx로 전환하고 러너·캐시 설정과 변경 경로별 잡 실행을 개선해 전체 파이프라인 시간을 **약 12분에서 6분으로 단축했습니다.**
    백엔드 서비스 리팩토링(Express → NestJS): |
      Express 기반 API는 기능이 늘면서 코드 간 의존성이 복잡해지고, 변경 영향을 파악하거나 테스트를 적용하기 어려워졌습니다. 이를 개선하기 위해 NestJS로 전환하면서 업무 도메인별 책임과 API·Worker의 역할을 정리했습니다.

      - 업무 도메인별로 모듈의 책임과 의존성을 정리하고, 팀 코드 컨벤션과 단위·통합 테스트 환경을 구축했습니다.
      - 사용자 요청과 자동 배치가 동일한 업무 로직을 사용하도록 API에 비즈니스 로직을 일원화했습니다. BullMQ Worker는 작업 실행과 재시도를 담당하고, 실제 업무 처리는 API를 호출하도록 분리했습니다.
      - 배치 작업의 실행 상태를 DB에 기록하고 Redis 락으로 동시 실행을 제어했습니다. 후속 개선 과정에서는 업무마다 락 연장과 실행 조건이 달라, 공통 Redis 락의 설계 범위를 재검토하고 책임을 분리했습니다.
    MES - SAP 연동 인터페이스 개발: |
      생산·납품·재고 정보를 수작업으로 전송하고 중복 입력하면서 생기는 지연과 오류 가능성을 줄이기 위해 실시간 연동 인터페이스를 개발했습니다.

      - ERP(SAP)와 MES 사이의 생산·납품·재고 이동 데이터를 실시간으로 연동했습니다.
      - SAP 기준정보를 MES에 자동 반영해 수작업 입력과 데이터 불일치 가능성을 줄였습니다.
    제천·슬로바키아 공장 MES 업그레이드: |
      VB6 기반 MES의 기술지원 종료와 개발 환경 제약을 해결하기 위해 제천·슬로바키아 공장의 MES를 C# 기반으로 리뉴얼하고 Oracle 데이터베이스를 업그레이드했습니다.

      - 기존 LOT 단위로만 가능하던 이력 추적을 **박스 단위까지 세분화**했습니다. 원자재부터 생산 공정·완제품까지 이력을 연결해 품질 문제 발생 시 관련 박스를 역추적할 수 있도록 개선했습니다.
      - 프로젝트 완료 후 과장으로 특진했습니다.
    SPC 이상현상 알림 시스템 개발: |
      일평균 약 100만 건의 생산 데이터가 발생하는 환경에서 **7가지 SPC 이상 징후를 SQL로 판정하는 로직**을 구현했습니다.

      공정 설비와 연동하는 TCP 소켓 기반 알림 모듈을 단독으로 설계·개발하고, 감지된 이상 징후를 SMS와 현황판으로 전달하도록 구성했습니다.
    백엔드: |
      Node.js, TypeScript, Express, NestJS, Prisma, Redis, BullMQ<br>
      C# (.NET Framework, .NET 6), gRPC, WCF
    프론트엔드: |
      Next.js, React, React Native, Expo, WinForms
    데이터: |
      PostgreSQL, Oracle, MySQL, PL/SQL, PL/pgSQL
    배포·운영: |
      GitLab CI/CD, Docker, Docker Swarm, buildx, Portainer, PM2, Turborepo
    문서 처리·검증: |
      Local LLM, Tesseract OCR, Vitest
