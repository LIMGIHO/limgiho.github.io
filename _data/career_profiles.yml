  pdf_url: /assets/resume/lim-giho-daangn-local-jobs-v16.pdf
  about: |
    <p class="hero-kicker">개발할 때 중요하게 생각하는 것</p>

    코드를 설계할 때는 중복을 줄이는 것보다 실제 업무의 의미와 책임이 잘 드러나는지를 중요하게 생각합니다. 비슷한 코드라도 업무에서 필요한 동작이 다르다면 무리해서 공통화하지 않으려고 합니다.

    기존 기능을 안전하게 변경할 수 있도록 테스트와 코드 리뷰를 중요하게 생각합니다. 정상 동작뿐 아니라 실패와 경계 조건을 확인하고, 변경에 따른 영향을 줄일 수 있는 구조를 고민합니다.

    운영 중 문제가 발생하면 처음 세운 가설에만 의존하지 않고, 로그와 실제 실행 환경을 다시 확인하며 원인을 찾으려고 합니다.
  excluded_projects:
    - RPA 프로젝트 (삼성 NERP 연동)
  description_overrides:
    KWE Korea: |
      항공·해운 수출입과 재무 업무를 다루는 사내 통합 플랫폼을 개발하고 운영합니다. 현업과 함께 업무 절차와 데이터 기준을 정리하고, 해외 본사 시스템 연동과 반복 업무 자동화를 담당합니다.
    통관 서류 검증 자동화: |
      미국·중국 통관 서류 9종의 55개 항목을 담당자가 수작업으로 대조하고 있어,
      서류 간 누락과 불일치를 자동으로 확인하는 검증 시스템을 개발했습니다.

      업체마다 다른 서류 양식과 DOC·DOCX·엑셀·PDF·스캔본 등 다양한 접수 형식을 처리하기 위해, 문서 내용을 해석하고 필요한 항목을 추출하는 데 LLM을 활용했습니다.

      - 통관 서류 9종의 55개 대조 항목에서 누락과 불일치를 자동 탐지했습니다.
      - 통관 1건의 서류 검토 시간을 **8분에서 3분**으로 줄였습니다.
      - 시스템 등록·관리와 회신 메일 작성·파일 첨부를 자동화해 **후속 업무에서 하루 약 1시간을 추가 절감**했습니다.
    웹 기반 통합 사내 시스템 구축: |
      항공·해운·재무 업무에는 15종 이상의 개별 시스템이 사용되고 있었고, 기능과 데이터도 여러 시스템에 나뉘어 있었습니다.
      업무 단계마다 데이터 기준이 달라 같은 정보를 반복 입력하거나 수기로 대조해야 했으며,
      시스템별 기술 스택이 달라 유지보수와 기능 확장에도 시간이 필요했습니다.

      - **15종 이상의 개별 시스템**을 항공·해운 수출입 및 재무 중심의 단일 웹 플랫폼으로 통합했습니다.
      - 5개 업무부가 개별 관리하던 거래처 정보 약 3만 건을 현업과 검토·정제하고 글로벌 코드 기준으로 통합했습니다.
      - 관세청 API와 스크래핑을 연동해 건당 약 10분 걸리던 조회를 **5초 이내**로 줄였습니다.
