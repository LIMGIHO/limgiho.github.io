flagship:
  id: integrated-platform
  title: 통합 업무 플랫폼 개발
  period: 2023–현재
  description: 분산되어 있던 운영 시스템을 웹·API·비동기 실행·외부 연동·데이터·배포 경계로 나누어 하나의 플랫폼으로 전환했습니다.
  scope_summary:
    - value: "15종"
      label: 운영 시스템 분석·전환
    - value: "90+"
      label: 업무 화면 구현
    - value: "5개"
      label: 업무 도메인 분리
    - value: "8종"
      label: 외부 시스템 연동
    - value: "4단계"
      label: API→Queue→Worker→API 내부 실행
    - value: "변경 앱만"
      label: CI/CD 빌드·배포
  boundaries:
    - id: presentation
      label: PRESENTATION
      description: 사용자 업무 화면
      x: 290
      y: 16
      width: 440
      height: 190
    - id: external-systems
      label: EXTERNAL SYSTEMS
      description: 플랫폼 경계 밖
      x: 30
      y: 400
      width: 270
      height: 190
    - id: integration-data
      label: DATA & INFERENCE
      description: 영속 데이터와 사내망 추론
      x: 310
      y: 400
      width: 420
      height: 190
    - id: async-execution
      label: ASYNC EXECUTION
      description: 비동기 작업과 예약 실행
      x: 780
      y: 400
      width: 390
      height: 190
  nodes:
    - id: api
      label: API
      tech: NestJS · TypeScript
      icon: nestjs
      icon_caption: NestJS
      kind: app
      boundary: application
      summary: 5개 도메인의 동기 요청 처리, Worker가 위임하는 배치 실행까지 포함
      implementation: 도메인 서비스가 데이터·외부 시스템 구현체를 직접 알지 않도록 포트와 어댑터로 분리했습니다. 외부 연동이 요청·수집·수신 세 방향이고 프로토콜이 제각각이라 하나로 억지 추상화하지 않고 각 구현을 어댑터로 격리했습니다. Worker가 호출하는 내부 배치 실행 엔드포인트도 같은 도메인 서비스를 재사용해, 실행 로직을 별도 앱으로 중복시키지 않았습니다.
      structure: |-
        <모듈>/
        ├─ adapter/
        │  ├─ controller/          HTTP 진입
        │  └─ dto/
        ├─ application/
        │  └─ usecase/
        │     └─ <유스케이스>/
        │        ├─ *.usecase.ts   업무 기능 하나
        │        ├─ dto.ts
        │        └─ mapper.ts
        └─ infra/
           └─ repository/          읽기 · 쓰기 분리
      structure_type: tree
      rationale: 초기 API는 Express로 자유도 높게 만들었고, 경계가 나뉘어 있지 않아 한 곳을 고치면 다른 곳이 깨졌습니다. NestJS와 클린 아키텍처를 도입해 모듈마다 방향을 고정했습니다.
      writeup:
        label: 이틀 동안 운영 API가 다섯 번 죽었다
        url: https://velog.io/@lasid84/nodejs-oom-postmortem
      operation: 요청 검증, 권한, 공통 오류 변환과 추적 정보를 한 경계에서 처리했습니다. 외부 오류는 내부 오류 형식으로 바꾸고 재시도 가능 여부를 구분했습니다.
      inputs: Web·PDA REST 요청 · Worker 내부 배치 실행 요청
      outputs: Repository 호출 · 로컬 LLM 호출 · 외부 연동 · Queue job · 배치 실행 결과
      contract: DTO validation · Symbol port · 공통 job package · 단기 인증 토큰
      deployment: API 컨테이너 수평 확장
      x: 530
      y: 250
      width: 180
      height: 100
    - id: pda
      label: 현장 PDA 앱
      tech: Next.js · PWA
      icon: nextjs
      icon_caption: Next.js
      kind: app
      boundary: presentation
      summary: Web과 별도로 배포되는 현장 단말용 PWA
      implementation: Web과 같은 Next.js 기반이지만 PWA로 패키징해 현장 단말에 설치형으로 배포하고, 독립된 파이프라인으로 빌드·배포합니다.
      structure: Next.js · PWA manifest · API client
      operation: Web과 별도 CI/CD 파이프라인으로 빌드·배포합니다.
      inputs: 현장 작업자 입력
      outputs: REST 요청
      contract: TypeScript DTO · HTTP status
      deployment: PDA 컨테이너 독립 배포
      x: 310
      y: 86
      width: 185
      height: 100
    - id: web
      label: Web
      tech: Next.js · React · TypeScript
      icon: nextjs
      icon_caption: Next.js
      kind: app
      boundary: presentation
      summary: 5개 업무 도메인의 90여 개 화면
      implementation: 화면 단위 로컬 슬라이스와 공통 도메인 슬라이스를 분리하고, 서버 상태와 화면 상태의 책임을 나눴습니다. 기능이 많은 화면은 그 안에서 기능별로 다시 나눴습니다.
      structure: |-
        <도메인 화면>/
        ├─ _container/       화면 조합 · 상태 연결
        ├─ _features/        업무 기능 묶음
        │  └─ <기능>/
        │     ├─ container/  기능 상태 · 이벤트
        │     ├─ view/       기능 표현
        │     └─ hooks/      기능별 훅
        ├─ _hooks/           화면 공통 훅
        └─ _store/           화면 상태
      structure_type: tree
      rationale: 프론트도 경계가 나뉘어 있지 않아 한 곳을 고치면 다른 화면이 깨졌습니다. API와 같은 방식으로 클린 아키텍처를 옮겨보려 했지만 상태 관리와 훅이 레이어 구분에 얹히지 않았습니다. 여러 구성을 시험한 끝에 기능 슬라이스로 나누는 FSD로 정리했습니다.
      operation: 화면과 기능이 폴더 단위로 갈려 있어 수정 범위가 그 폴더 안에 머뭅니다.
      inputs: 사용자 입력 · 조회 조건 · 첨부 문서
      outputs: REST 요청 · 업무 결과 화면 · 파일 다운로드
      contract: TypeScript DTO · HTTP status · 공통 오류 형식
      deployment: Web 컨테이너 독립 배포
      x: 530
      y: 86
      width: 180
      height: 100
    - id: external
      label: 외부 시스템 8종
      tech: EDI 전문 · 저울 TCP 소켓 · FTP · 스케줄 수집
      kind: boundary
      boundary: external-systems
      summary: 플랫폼 밖에서 연동하는 시스템 8종
      implementation: 요청·수집·수신 세 방향이고 프로토콜이 제각각이라 하나로 억지 추상화하지 않았습니다. 전문 형식과 응답 규칙은 상대 시스템이 정하고 플랫폼이 거기 맞춥니다. 본사 운영 시스템만은 연동 규격을 문서로 받을 수 없어, 화면이 주고받던 요청을 뜯어 직접 알아냈습니다.
      structure: |-
        요청형 EDI 전송
        · 수집형 스케줄러
          (환율·선사·항구·운임 마스터, 공휴일, 요율)
        · TCP 클라이언트로 저울 데이터 수집
        · 파일 교환
        · 본사 운영 시스템 화면 호출 재현
      inputs: 플랫폼 요청 · 스케줄 수집
      outputs: 전문 응답 · 마스터 데이터 · 저울 측정값
      contract: EDI 810 전문 형식 · 소켓 프로토콜 · 파일 규격 · 직접 알아낸 HTTP 호출 규격
      x: 48
      y: 470
      width: 234
      height: 100
    - id: local-llm
      label: 로컬 LLM
      tech: 사내망 추론 서버 · 문서 추출 · OCR
      kind: infra
      boundary: integration-data
      summary: 문서 추출을 사내망 안에서 처리
      implementation: 추론 서버를 사내망 장비에 띄우고 HTTP로 호출합니다. 고객사 문서라 망 밖으로 나갈 수 없어 외부 API를 쓰지 않았습니다. 추출 결과는 JSON Schema와 정규식으로 교차 검증합니다.
      structure: |-
        텍스트 레이어 판정
        · 스캔본 OCR(전체 페이지 → 표 영역 재인식)
        · schema parser · evaluation harness
      operation: PDF에 텍스트 레이어가 있으면 그대로 읽고, 스캔본만 OCR로 처리합니다. 렌더 해상도는 실물 문서로 반복 측정해 정했습니다. 300dpi에서 나던 오인식이 400dpi에서 사라졌고 처리 시간은 거의 같았습니다.
      inputs: 수출입 문서 · 추출 스키마
      outputs: 검증된 구조화 데이터 · 실패 사유
      contract: Internal HTTP · JSON Schema
      deployment: 사내망 추론 서버 독립 운영
      x: 330
      y: 470
      width: 185
      height: 100
    - id: data
      label: PostgreSQL
      tech: PostgreSQL
      kind: infra
      boundary: integration-data
      summary: 여러 DBMS에서 옮겨와 하나로 합친 운영 데이터
      implementation: 흩어져 있던 운영 데이터를 스키마부터 다시 설계해 PostgreSQL 하나로 합쳤습니다. 이관 대상은 1,000만 건이 넘습니다.
      structure: 업무 스키마 · 마이그레이션
      operation: 스키마 변경은 마이그레이션 파일로 관리합니다.
      inputs: API의 데이터 접근
      outputs: 업무 데이터 · 트랜잭션 결과
      contract: SQL · 트랜잭션 경계
      x: 535
      y: 470
      width: 175
      height: 100
    - id: queue
      label: 작업 계약 · 큐
      tech: Redis · BullMQ
      icon: redis
      icon_caption: Redis
      kind: infra
      boundary: async-execution
      summary: API와 Worker가 타입이 보장된 작업 계약을 공유
      implementation: 큐 이름, 작업 유형·상태·모드와 payload 타입을 공용 계약 패키지로 묶어 API와 Worker가 같은 타입을 참조하게 했습니다.
      structure: queue-names · job type/status/mode · typed payload · cron catalog 생성 스크립트
      operation: 큐마다 동시성과 락 유지 시간을 따로 정의했습니다. 오래 걸리는 잡만 락을 올리고 나머지는 기본값을 씁니다.
      inputs: API enqueue
      outputs: Worker로 전달되는 작업 · 재시도 · 실패 기록
      contract: 공용 작업 계약 패키지 · typed payload
      deployment: Redis 인프라 독립 운영
      x: 795
      y: 470
      width: 150
      height: 100
    - id: worker
      label: Worker
      tech: NestJS · BullMQ · 스케줄러
      icon: nestjs
      icon_caption: NestJS
      kind: app
      boundary: async-execution
      summary: 예약·큐 작업을 API 내부 엔드포인트로 전달하는 경량 트리거
      implementation: 업무 로직이나 DB 접근을 직접 갖지 않는 경량 트리거로 설계했습니다. node-cron 스케줄과 BullMQ 큐 컨슈머가 발생시킨 작업을 단기 인증 토큰으로 검증한 뒤 API의 내부 엔드포인트에 위임합니다. 예전에 별도 실행 앱이 맡던 파일 수집·자동 입력 실행도 이 경로로 API에 흡수됐습니다.
      structure: scheduler trigger · queue consumer · internal auth client · distributed lock
      rationale: Worker가 DB를 직접 보면 업무 로직이 API와 Worker 두 군데로 갈라집니다. 고칠 곳이 늘고 두 곳이 어긋나기도 쉬워서, Worker는 실행만 트리거하는 얇은 역할로 두고 로직은 API에 모았습니다.
      operation: 스케줄 실행 전 Redis 락으로 다중 replica의 중복 실행을 막고, 토큰 만료 전 재발급으로 장시간 실행에도 인증이 끊기지 않게 했습니다.
      inputs: 큐 작업 · 예약 스케줄
      outputs: API 내부 실행 요청
      contract: 공용 작업 계약 패키지 · 단기 인증 토큰
      deployment: Worker 컨테이너 다중 replica
      x: 995
      y: 470
      width: 165
      height: 100
  edges:
