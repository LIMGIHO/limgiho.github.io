flagship:
  id: integrated-platform
  title: 15종 레거시 시스템을 단일 플랫폼으로
  period: 2023–현재
  legacy_count: 15
  domain_count: 5
  problem: 15종 이상의 프로그램과 3종의 DBMS가 각자 업무와 외부 연동을 품고 있어 변경과 장애의 영향 범위를 파악하기 어려웠습니다.
  constraint: 매일 사용하는 운영 시스템이므로 업무를 중단하거나 전체 기능을 한 번에 재작성할 수 없었습니다.
  role: 기존 시스템 분석, 목표 구조 설계, 웹·API 구현, 데이터 전환, 단계별 배포와 운영을 주도했습니다.
  outcomes:
    - 15종의 분산된 시스템을 5개 업무 도메인의 단일 웹 플랫폼으로 수렴
    - 외부 조회 업무를 건당 10분에서 5초 이내로 단축
    - 변경 경계와 배포 계약을 코드와 빌드 단계에서 검증
  evidence:
    - id: database-migration
      title: 1,000만 건 이상 이기종 데이터 이관과 교차 검증
      description: Oracle과 PostgreSQL 양쪽 데이터를 자동 비교해 누락과 불일치를 검증했습니다.
    - id: backend-modernization
      title: Express에서 NestJS 모듈 구조로 점진적 전환
      description: 운영 중인 구 API를 유지한 채 도메인 단위로 신규 구조에 이전했습니다.
    - id: delivery-standardization
      title: 테스트 게이트와 변경 경로 기반 CI/CD 표준화
      description: 실패한 테스트가 배포로 이어지지 않고 변경된 앱만 빌드되도록 구성했습니다.
  architecture:
    before:
      - 업무 클라이언트
      - 자동화 도구
      - 정산·재무
      - 외부 연동
      - 이기종 DB
    after:
      - Web · 90+ screens
      - API · Queue · Worker
      - 5개 업무 도메인
      - 통합 데이터
      - 외부 어댑터
  decisions:
    - id: integration
      title: 왜 통합인가
      problem: 15종 클라이언트가 각자 DB와 외부 시스템에 직접 붙어 있었습니다. 같은 정산입력 자동화가 업무별로 여러 벌 존재했고, 장애가 나면 어디서 시작됐는지 추적하기 어려웠습니다.
      alternative: 레거시를 그대로 두고 연동 게이트웨이만 앞에 세우는 안도 검토했습니다. 단기 비용은 낮지만 중복 로직은 그대로 남습니다.
      choice: 화면과 API를 하나의 플랫폼으로 수렴시키고, 외부 연동은 어댑터 한 층으로 모았습니다. 데이터 접근 경로를 하나로 만드는 것이 목적이었습니다.
      result: 새 외부 시스템을 붙일 때 고쳐야 할 곳이 15곳에서 1곳이 됐습니다.
    - id: frontend-slices
      title: 클린 아키텍처를 프론트에 넣으려다 접었다
      problem: 백엔드에서 레이어 분리로 효과를 봤기에 같은 구조를 프론트에 이식했습니다. 그런데 화면 하나를 고치려면 여러 폴더를 오가야 했고, 레이어 대부분이 통과만 하는 껍데기가 됐습니다.
      alternative: 레이어를 유지하고 규칙을 더 촘촘히 만드는 방향도 시도했습니다. 규칙이 늘수록 신규 화면 작성 비용만 올라갔습니다.
      choice: 업무 화면 90여 개는 화면 자체가 업무 단위였습니다. 화면 폴더 안에 로컬 슬라이스를 두고, 화면을 넘어 재사용되는 것만 도메인 슬라이스로 올렸습니다.
      result: 화면 수정이 폴더 하나 안에서 끝나고 삭제도 폴더 단위로 수행할 수 있게 됐습니다.
    - id: typed-boundaries
      title: 경계를 규칙이 아니라 타입으로 지켰다
      problem: 폴더로 계층을 나눠도 시간이 지나면 도메인이 인프라를 직접 호출합니다. 코드 리뷰만으로 막는 데는 한계가 있었습니다.
      alternative: 린트 규칙으로 import 경로를 막는 방법도 있었습니다. 우회가 쉽고 위반 시점이 늦었습니다.
      choice: 도메인은 Symbol 포트만 알고 구현체는 모듈 등록에서 주입했습니다. 확장되는 지점은 유형 목록을 키로 가진 레코드 타입으로 두어 새 유형의 핸들러가 빠지면 컴파일되지 않게 했습니다.
      result: 등록을 잊은 채 배포되는 사고를 구조적으로 차단했습니다.
    - id: incremental-migration
      title: 한 번에 갈아엎지 않았다
      problem: 레거시 API는 매일 쓰이는 운영 시스템이었습니다. 전면 재작성은 멈출 수 없는 업무를 볼모로 잡는 일이었습니다.
      alternative: 기능 동결 후 일괄 전환도 검토했습니다. 전환 기간 동안 개선 요청을 모두 거절해야 했습니다.
      choice: 구 API를 살려둔 채 모듈 단위로 신규 API에 이전했습니다. 공용 라이브러리도 구·신 두 벌을 병행하고 신규 기능은 신규 구조에만 넣었습니다.
      result: 운영 중단 없이 전환했고, 어느 시점에 멈춰도 시스템이 동작하도록 유지했습니다.
    - id: worker-contract
      title: 배포 단위가 다른 둘 사이의 계약
      problem: 잡을 넣는 API와 꺼내 쓰는 Worker가 따로 배포됩니다. 페이로드 필드 하나를 바꾸면 배포 순서에 따라 런타임 오류가 발생했습니다.
      alternative: 메시지에 버전을 붙여 양쪽에서 분기하는 방법도 검토했습니다. 분기가 쌓이면 제거하기 어려워집니다.
      choice: 큐 이름, 잡 타입, 페이로드, 내부 라우트를 한 패키지에 모으고 양쪽이 그것만 참조하게 했습니다. 계약을 바꾸면 두 앱이 함께 컴파일 대상이 됩니다.
      result: 계약 위반이 런타임이 아니라 빌드 단계에서 드러납니다.
    - id: distributed-cron
      title: replica를 늘리자 크론이 두 번 돌았다
      problem: 가용성을 위해 Worker를 2대로 늘렸더니 예약 작업이 양쪽에서 동시에 실행되어 집계가 중복 반영됐습니다.
      alternative: Worker 한 대를 예약 실행 전담으로 고정할 수 있었지만, 그 한 대가 멈추면 전체 예약 실행이 중단됩니다.
      choice: 실행 직전 Redis에 TTL을 가진 키를 NX로 선점하게 했습니다. 선점에 성공한 한 대만 실행하고 나머지는 넘어갑니다.
      result: Worker 수가 늘어도 잡은 한 번만 실행되고, 한 대가 멈춰도 남은 대가 이어받습니다.
    - id: private-llm
      title: 서류를 밖으로 내보낼 수 없었다
      problem: 수출입 서류에는 거래처 단가와 신고 정보가 들어 있어 외부 API로 전송할 수 없었습니다.
      alternative: 사람이 계속 입력하거나 규칙 기반 파서를 만들 수 있었지만, 거래처마다 다른 서식을 규칙만으로 감당하기 어려웠습니다.
      choice: 사내망에 OpenAI 호환 추론 서버를 두었습니다. 출력은 JSON Schema로 제한하고 형식이 정해진 값은 정규식으로 교차 검증하며, 텍스트 품질이 낮은 PDF만 OCR로 넘겼습니다.
      result: 서류가 사내망을 벗어나지 않고 스키마를 벗어난 응답은 파싱 단계에서 차단됩니다.
    - id: llm-evaluation
      title: 믿지 않고 측정했다
      problem: 모델 출력은 매번 같지 않아 잘 되는 것 같다는 느낌만으로 운영에 올릴 수 없었습니다.
      alternative: 샘플 몇 건을 눈으로 확인하는 방식은 실패율이 낮을수록 문제를 발견하기 어렵습니다.
      choice: 같은 문서를 반복 추출해 결과를 DB에 적재하는 평가 하네스를 만들고 프롬프트나 모델을 바꿀 때마다 실행했습니다. OCR은 자식 프로세스로 분리해 장시간 메모리 증가도 막았습니다.
      result: 추출 신뢰도를 수치로 비교할 수 있고, 장시간 운영에서도 API 메모리가 안정적으로 유지됩니다.
    - id: adapter-boundary
      title: 외부 8종을 한 경계 뒤로
      problem: 공공 통관 API, 상용 EDI 플랫폼, 거래처 전문, 계근대 하드웨어까지 연동 방식이 제각각이었고 각 시스템이 필요할 때마다 직접 연결했습니다.
      alternative: 공통 클라이언트 하나로 추상화하는 방법도 검토했지만 HTTP, FTP, 소켓을 하나로 묶으면 억지 추상화가 됩니다.
      choice: 추상화를 강요하지 않고 위치만 통일했습니다. 외부와 통신하는 코드는 어댑터 층에 두고 도메인은 포트 인터페이스만 봅니다.
      result: 외부 장애와 사양 변경이 도메인으로 새지 않고, 연동 하나를 교체해도 도메인 코드는 유지됩니다.
    - id: affected-deploy
      title: 모노레포에서 바뀐 것만 배포한다
      problem: 여러 앱이 한 저장소에 있어 커밋 하나에도 전체가 빌드됐고, 대기 시간이 길며 무관한 앱까지 재배포됐습니다.
      alternative: 앱마다 저장소를 나누면 공용 패키지의 버전 관리 비용이 커집니다.
      choice: 부모 파이프라인이 변경 경로를 감지해 해당 앱의 자식 파이프라인만 실행했습니다. 빌드가 생성한 커밋 SHA 이미지 태그를 배포가 그대로 사용합니다.
      result: 무관한 앱은 실행되지 않고 운영 중인 이미지와 커밋의 관계를 태그로 추적할 수 있습니다.

automation:
  id: external-workflow-automation
  title: 외부 업무 시스템 입력 자동화
  problem: 여러 담당자가 문서를 확인하고 같은 데이터를 외부 업무 시스템에 반복 입력하면서 휴먼 에러와 장시간 수작업이 발생했습니다.
  role: 문서 검증 규칙, 자동 입력 흐름, 실패 감지와 재처리 도구를 설계하고 구현했습니다.
  steps:
    - label: 검증
      description: 필수값, 합계, 형식과 업무 조건을 입력 전에 확인했습니다.
    - label: 처리
      description: 검증을 통과한 데이터만 자동 전송하고 입력 결과를 기록했습니다.
    - label: 예외
      description: 실패 원인과 처리 위치를 남기고 담당자가 안전하게 재처리할 수 있게 했습니다.
  result: 반복 작업을 무인 흐름으로 전환해 월 기준 약 1,200시간의 수작업을 절감했습니다.

