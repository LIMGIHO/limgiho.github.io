flagship:
  id: integrated-platform
  title: 통합 업무 플랫폼 개발
  period: 2023–현재
  description: 분산되어 있던 운영 시스템을 웹·API·비동기 실행·외부 연동·데이터·배포 경계로 나누어 하나의 플랫폼으로 전환했습니다.
  scope_summary:
    - value: "15종"
      label: 운영 시스템 분석·전환
    - value: "90+"
      label: 업무 화면 구현
    - value: "5개"
      label: 업무 도메인 분리
    - value: "8종"
      label: 외부 시스템 연동
    - value: "4단계"
      label: API·Queue·Worker·Batch
    - value: "변경 앱만"
      label: CI/CD 빌드·배포
  boundaries:
    - id: presentation
      label: PRESENTATION
      description: 사용자 업무 화면
      x: 470
      y: 16
      width: 260
      height: 138
    - id: integration-data
      label: INTEGRATION & DATA
      description: 외부 경계와 영속 데이터
      x: 30
      y: 360
      width: 520
      height: 310
    - id: async-execution
      label: ASYNC EXECUTION
      description: 비동기 작업과 예약 실행
      x: 580
      y: 360
      width: 590
      height: 310
  nodes:
    - id: web
      label: Web
      tech: Next.js · React · TypeScript
      icon: nextjs
      icon_caption: Next.js
      kind: app
      boundary: presentation
      summary: 5개 업무 도메인의 90여 개 화면
      implementation: 화면 단위 로컬 슬라이스와 공통 도메인 슬라이스를 분리하고, 서버 상태와 화면 상태의 책임을 나눴습니다.
      structure: 도메인 라우트 · 화면 로컬 모듈 · 공통 UI · API client
      operation: 기능별 오류 경계를 두고 배포 후 화면 단위로 확인할 수 있게 구성했습니다.
      inputs: 사용자 입력 · 조회 조건 · 첨부 문서
      outputs: REST 요청 · 업무 결과 화면 · 파일 다운로드
      contract: TypeScript DTO · HTTP status · 공통 오류 형식
      deployment: Web 컨테이너 독립 배포
      x: 525
      y: 38
      width: 150
      height: 100
    - id: api
      label: API
      tech: NestJS · TypeScript
      icon: nestjs
      icon_caption: NestJS
      kind: app
      boundary: application
      summary: 5개 도메인의 동기 요청 처리
      implementation: 도메인 서비스가 데이터·외부 시스템 구현체를 직접 알지 않도록 포트와 어댑터로 분리했습니다.
      structure: Controller · Application Service · Domain · Port · Adapter
      operation: 요청 검증, 권한, 공통 오류 변환과 추적 정보를 한 경계에서 처리했습니다.
      inputs: Web REST 요청 · Worker 내부 요청
      outputs: Repository 호출 · 외부 연동 · Queue job
      contract: DTO validation · Symbol port · 공통 job package
      deployment: API 컨테이너 수평 확장
      x: 525
      y: 200
      width: 150
      height: 100
    - id: external
      label: 외부 연동 8종
      tech: 공공 API · 거래처 EDI 전문 · 현장 장비 소켓 · FTP
      kind: boundary
      boundary: integration-data
      summary: 유형이 다른 외부 연동 8종
      implementation: 통신 방식을 하나로 억지 추상화하지 않고 각 구현을 어댑터로 격리했습니다.
      structure: 공공 API · 업무 플랫폼 · 거래처 전문 · 현장 장비 어댑터
      operation: 외부 오류를 내부 오류 형식으로 변환하고 재시도 가능 여부를 구분했습니다.
      inputs: 도메인 포트 호출 · Worker 작업
      outputs: 외부 요청 · 표준화된 내부 응답
      contract: Port interface · timeout · retry policy
      deployment: API 또는 Worker 배포 단위에 포함
      x: 65
      y: 430
      width: 210
      height: 82
    - id: local-llm
      label: 사내망 문서 추출
      tech: 수출 문서 → 구조화 데이터
      kind: boundary
      boundary: integration-data
      summary: 문서 추출을 사내망 안에서 처리
      implementation: 추론 서버를 내부 HTTP 경계로 분리하고 JSON Schema와 정규식으로 결과를 교차 검증했습니다.
      structure: PDF text extraction · OCR fallback · schema parser · evaluation harness
      operation: 저품질 문서만 OCR로 전환하고 반복 평가 결과를 저장해 변경 전후를 비교했습니다.
      inputs: 수출입 문서 · 추출 스키마
      outputs: 검증된 구조화 데이터 · 실패 사유
      contract: Internal HTTP · JSON Schema
      deployment: 사내망 추론 서버 독립 운영
      x: 305
      y: 430
      width: 210
      height: 82
    - id: data
      label: 이기종 데이터
      tech: PostgreSQL · Oracle · MySQL · ODBC
      kind: infra
      boundary: integration-data
      summary: 운영 데이터와 이관 검증 저장소
      implementation: Repository 경계 안에서 DBMS별 접근을 분리하고 1,000만 건 이상 이관 데이터를 양쪽에서 교차 검증했습니다.
      structure: 업무 schema · migration job · source/target comparator
      operation: 건수, 키, 합계와 필드 값을 단계별로 비교해 누락과 불일치를 기록했습니다.
      inputs: Repository query · 이관 원천 데이터
      outputs: 업무 데이터 · 정합성 검증 결과
      contract: Repository interface · transaction boundary
      deployment: 관리형 DB와 기존 DB 병행 운영
      x: 165
      y: 575
      width: 240
      height: 82
    - id: queue
      label: Queue
      tech: Redis · BullMQ
      icon: redis
      icon_caption: Redis
      kind: infra
      boundary: async-execution
      summary: API와 Worker 사이 작업 전달
      implementation: 큐 이름, 작업 유형과 payload 타입을 공용 계약 패키지로 묶었습니다.
      structure: queue registry · typed payload · retry/backoff policy
      operation: 실패 횟수와 재시도 간격을 작업별로 정의하고 처리 상태를 추적했습니다.
      inputs: API enqueue
      outputs: Worker consume · retry · failed job
      contract: Shared typed job contract
      deployment: Redis 인프라 독립 운영
      x: 615
      y: 430
      width: 150
      height: 100
    - id: worker
      label: Worker
      tech: NestJS · BullMQ · Redis lock
      icon: nestjs
      icon_caption: NestJS
      kind: app
      boundary: async-execution
      summary: 비동기·예약 작업 실행 조정
      implementation: 작업 핸들러를 유형별로 등록하고 Redis NX·TTL 잠금으로 다중 replica의 중복 실행을 막았습니다.
      structure: consumer · handler registry · scheduler · distributed lock
      operation: API와 별도 확장하며 실패 작업의 원인과 재처리 위치를 남겼습니다.
      inputs: Queue job · cron schedule
      outputs: Batch 실행 · 외부 어댑터 호출 · 처리 결과
      contract: Shared job package · idempotency key
      deployment: Worker 컨테이너 다중 replica
      x: 940
      y: 430
      width: 150
      height: 100
    - id: batch
      label: Batch
      tech: Node.js · C# · Browser automation
      kind: app
      boundary: async-execution
      summary: 파일·수집·입력 자동화 실행
      implementation: 스크래핑, FTP, Excel, 외부 화면 입력을 실행 단위로 분리하고 입력 전 검증 단계를 공통화했습니다.
      structure: validator · executor · result recorder · retry tool
      operation: 성공 위치와 실패 원인을 기록해 중복 없이 이어서 재처리할 수 있게 했습니다.
      inputs: Worker job · 문서 · 전송 파일
      outputs: 외부 입력 결과 · 처리 로그 · 산출 파일
      contract: Job command · execution result
      deployment: 작업 특성별 실행 이미지 분리
      x: 915
      y: 575
      width: 200
      height: 82
    - id: cicd
      label: CI/CD
      tech: GitLab CI · Kaniko · Docker Swarm
      icon: docker
      icon_caption: Docker Swarm
      kind: pipeline
      boundary: delivery
      summary: 변경된 앱만 테스트·빌드·배포
      implementation: 부모 파이프라인이 변경 경로를 판별해 해당 앱의 자식 파이프라인만 실행하도록 구성했습니다.
      structure: affected detection → Test → Kaniko Build → Swarm Deploy
      operation: 테스트 실패 시 배포를 차단하고 커밋 SHA 이미지 태그로 실행 버전을 추적했습니다.
      inputs: Git diff · commit SHA · pipeline variables
      outputs: 검증된 컨테이너 이미지 · Swarm service update
      contract: 동일 SHA 태그 build/deploy · test gate
      deployment: 앱별 child pipeline
      x: 500
      y: 730
      width: 200
      height: 90
