  pipeline:
    steps:
      - 변경 앱 감지
      - Test
      - Kaniko Build
      - Swarm Deploy
  document_flow:
    title: 문서 처리
    description:
      - 사내망 안에서만 처리되는 문서 추출 파이프라인입니다. Worker 동시성은 프로세스당 1건, 운영 레플리카 2개라 서버 전체 최대 2건입니다. 큐 등록이 실패해도 첨부 업로드는 실패시키지 않고 경고 로그로 남깁니다.
      - OCR은 자식 프로세스에서 건별로 실행하고, 부모는 파일 경로만 넘깁니다. 타임아웃이면 SIGTERM 후 필요 시 SIGKILL입니다. 렌더 해상도는 실물 문서로 반복 측정해 정했습니다. 300dpi에서 나던 오인식이 400dpi에서 사라졌고 처리 시간은 거의 같았습니다.
      - 재시도는 3회, 30초 지수 백오프입니다. 반복 평가 결과를 저장해 변경 전후를 비교합니다 (evaluation harness).
    boundary:
      label: 사내망 내부 처리
      description: 문서가 외부로 나가지 않습니다
      x: 20
      y: 16
      width: 1220
      height: 478
    nodes:
      - id: doc-intake
        label: 첨부 업로드
        detail: 큐 등록
        kind: process
        x: 40
        y: 70
        width: 150
        height: 74
      - id: doc-layer
        label: 텍스트 레이어 판정
        detail: ""
