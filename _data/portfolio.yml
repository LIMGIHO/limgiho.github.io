  pipeline:
    steps:
      - 변경 앱 감지
      - Test
      - Kaniko Build
      - Swarm Deploy
  document_flow:
    title: 문서 처리
    description:
      - 사내망 안에서만 처리되는 문서 추출 파이프라인입니다. Worker 동시성은 프로세스당 1건, 운영 레플리카 2개라 서버 전체 최대 2건입니다. 큐 등록이 실패해도 첨부 업로드는 실패시키지 않고 경고 로그로 남깁니다.
      - 렌더 해상도는 실물 문서로 반복 측정해 정했습니다. 300dpi에서 나던 오인식이 400dpi에서 사라졌고 처리 시간은 거의 같았습니다.
