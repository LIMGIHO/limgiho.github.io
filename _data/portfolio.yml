writings:
  - title: 이틀 동안 운영 API가 다섯 번 죽었다
    summary: 원인을 세 번 짚었고 두 번 틀렸다. 로그 줄 수, 설치된 버전, 조회 행수를 직접 세서 잡았다.
    facts:
      - 커널 OOM 6~10GiB
      - 조회 54,565행
      - 반복 측정 480회
    url: https://velog.io/@lasid84/nodejs-oom-postmortem

  - title: Next.js + BFF 인증 흐름 총정리
    summary: 액세스 토큰을 메모리에, 리프레시를 HttpOnly 쿠키에 두는 구성이다. 새로고침 복원과 401이 겹칠 때의 재발급까지 정리했다.
    facts:
      - 액세스는 메모리
      - 리프레시는 HttpOnly 쿠키
      - 401에 single-flight 재발급
    url: https://velog.io/@lasid84/Next.js-BFF-AUTH-FLOW

  - title: CI/CD 적용기 2편
    summary: rsync와 PM2로 시작한 배포를 컨테이너와 Swarm으로 옮긴 과정이다. docker socket 없이 이미지를 굽고, 롤링 업데이트와 SHA 롤백까지 붙였다.
    facts:
      - docker socket 없이 Kaniko 빌드
      - start-first 롤링 업데이트
      - SHA 태그로 롤백
    url: https://velog.io/@lasid84/CICD-2

