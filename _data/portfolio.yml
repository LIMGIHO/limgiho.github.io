automation:
  id: external-workflow-automation
  title: 외부 업무 시스템 입력 자동화
  problem: 여러 담당자가 문서를 확인하고 같은 데이터를 외부 업무 시스템에 반복 입력하면서 휴먼 에러와 장시간 수작업이 발생했습니다.
  role: 문서 검증 규칙, 자동 입력 흐름, 실패 감지와 재처리 도구를 설계하고 구현했습니다.
  steps:
    - label: 검증
      description: 필수값, 합계, 형식과 업무 조건을 입력 전에 확인했습니다.
    - label: 처리
      description: 검증을 통과한 데이터만 자동 전송하고 입력 결과를 기록했습니다.
    - label: 예외
      description: 실패 원인과 처리 위치를 남기고 담당자가 안전하게 재처리할 수 있게 했습니다.
  result: 반복 작업을 무인 흐름으로 전환해 월 기준 약 1,200시간의 수작업을 절감했습니다.

