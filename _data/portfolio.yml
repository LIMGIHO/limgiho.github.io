automation:
  id: external-workflow-automation
  title: 본사 운영 시스템 입력 자동화
  brief:
    - label: 문제
      description: 다섯 부서가 본사 글로벌 운영 시스템 화면에서 건마다 같은 절차를 반복했습니다. 많게는 한 업무를 하루에 백 번 넘게 반복했습니다.
    - label: 제약
      description: 본사 시스템이라 연동 API도 자동화 도구도 열려 있지 않았습니다. 사람이 화면을 여는 것 말고는 들어갈 경로가 없었습니다.
    - label: 접근
      description: 개발자 도구로 화면이 주고받는 요청과 응답을 뜯어, 어떤 요청을 어떤 순서로 보내야 하는지 알아냈습니다. 응답 스키마에 맞춰 저장 구조도 설계했습니다.
  layers:
    - label: 외부 호출
      count: 75개
      description: 화면이 보내던 요청을 하나씩 그대로 재현합니다.
    - label: 업무 워크플로
      count: 12종
      description: 사람이 처리하던 업무 한 건이 호출 한 번이 되도록 묶었습니다.
  case:
    title: 항공 운송장 갱신 한 건
    description: 사람이 화면을 아홉 번 오가야 끝나던 일입니다. 조회 여섯 번, 재계산 두 번, 저장 한 번입니다.
