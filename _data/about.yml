general: |
  <p class="hero-kicker">반복되는 수작업과 실수를 시스템으로 줄이는 개발자 임기호입니다.</p>

  물류·제조 현장에서 Node.js, TypeScript, C#, .NET으로 업무 시스템을 개발하고 운영해 왔습니다.
  따로 운영되던 시스템을 연결하고, 사람이 반복하던 작업을 자동화하며,
  오래된 시스템과 데이터베이스를 전환하는 일을 해왔습니다.

  기능 구현뿐 아니라 실제 업무 흐름을 이해하고, 운영과 유지보수까지 고려해 개선하는 것을 중요하게 생각합니다.

backend: |
  <p class="hero-kicker">업무 데이터의 정확성과 시스템의 안정성을 중요하게 생각하는 백엔드 개발자 임기호입니다.</p>

  물류·제조 현장에서 Node.js, TypeScript, C#, .NET으로 업무 시스템을 개발하고 운영해 왔습니다.
  분리된 시스템과 데이터를 통합하고, 세금계산서 시스템의 1,000만 건 데이터 이관과 정합성 검증을 수행했습니다.

  기능이 늘어도 유지보수할 수 있도록 백엔드 구조를 개선하고, 단위·통합 테스트와 배포 절차를 정비해 왔습니다.
  실제 업무를 이해하고 동료들과 개발 기준을 맞추며, 운영 중에도 신뢰할 수 있는 시스템을 만드는 데 기여하고 싶습니다.
