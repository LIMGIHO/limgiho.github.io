<section class="test2-section test2-products" id="products" aria-labelledby="products-title">
  <header class="test2-section-heading">
    <h2 id="products-title">업무 시스템 밖에서도<br>직접 만들고 운영합니다</h2>
    <p>출시하고 운영 중인 개인 제품은 설명보다 실제 화면을 먼저 보여줍니다.</p>
  </header>

  <div class="test2-product-spreads">
    {% for item in include.items %}
      <article class="test2-product-spread">
        <div class="test2-product-screens">
          {% for shot in item.screenshots %}
            <img src="{{ '/assets/portfolio/screenshots/' | append: shot.file | relative_url }}" alt="{{ shot.alt }}" loading="lazy" width="266" height="592">
          {% endfor %}
        </div>
        <div class="test2-product-copy">
          <h3>{{ item.title }}</h3>
          <p>{{ item.summary }}</p>
          <p class="test2-product-tech">{{ item.technologies | join: ' / ' }}</p>
          <div class="test2-product-links">
            {% for link in item.links %}<a href="{{ link.url }}">{{ link.label }}</a>{% endfor %}
          </div>
        </div>
      </article>
    {% endfor %}
  </div>
</section>
