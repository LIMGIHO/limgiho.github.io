<section class="test2-hero" id="case-01" aria-labelledby="test2-title">
  <div class="test2-hero-copy">
    <h1 id="test2-title">15개의 운영 시스템을<br>하나의 플랫폼으로 전환했습니다.</h1>
    <p class="test2-hero-deck">{{ include.flagship.description }}</p>
    <dl class="test2-hero-context">
      <div>
        <dt>역할</dt>
        <dd>설계 · 개발 · 데이터 전환 · 운영</dd>
      </div>
      <div>
        <dt>기간</dt>
        <dd>{{ include.flagship.period }}</dd>
      </div>
    </dl>
    <a class="test2-primary-link" href="#case-story">전환 과정 읽기</a>
  </div>

  <figure class="test2-transform" aria-labelledby="test2-transform-caption">
    <div class="test2-transform-header">
      <span>CHANGE RECORD</span>
      <span>PLATFORM / 2023–NOW</span>
    </div>

    <div class="test2-transform-body">
      <div class="test2-before">
        <p>분산 운영</p>
        <div class="test2-before-grid" aria-label="통합 전 운영 시스템 15종">
          {% for number in (1..15) %}<span>SYS {{ number }}</span>{% endfor %}
        </div>
      </div>

      <div class="test2-change-spine" aria-label="전환 결정">
        <span>분석</span>
        <span>경계 재설계</span>
        <span>데이터 이관</span>
      </div>

      <div class="test2-after">
        <p>단일 플랫폼</p>
        <div class="test2-platform-map" aria-label="통합 후 플랫폼 실행 단위">
          <strong>Web</strong>
          <strong>API</strong>
          <strong>Queue</strong>
          <strong>Worker</strong>
          <strong>PostgreSQL</strong>
        </div>
      </div>
    </div>

    <ul class="test2-proof-notes" aria-label="전환 결과">
      <li><strong>1,000만+</strong><span>데이터 이관</span></li>
      <li><strong>90+</strong><span>업무 화면</span></li>
      <li><strong>변경 앱만</strong><span>빌드 · 배포</span></li>
    </ul>
    <figcaption id="test2-transform-caption">15종 운영 시스템을 하나의 플랫폼 경계로 전환한 구조</figcaption>
  </figure>
</section>
