{% assign platform_departments = "항공수출,항공수입,해운수출,해운수입,재무" | split: "," %}
{% assign platform_legacy_stacks = "C# · MySQL|VB6 · MySQL|React · PostgreSQL|Excel|Oracle Forms · Oracle" | split: "|" %}
<figure class="platform-transition" aria-label="5개 업무부의 개별 시스템을 하나의 웹 플랫폼으로 통합" markdown="0">
  <div class="platform-transition-before">
    <div class="platform-transition-heading"><span>BEFORE</span><strong>프로그램마다 따로 관리</strong></div>
    <p class="platform-transition-subtitle">항공·해운·재무 등 15종 이상의 개별 시스템</p>
    <div class="platform-legacy-systems">
      {% for department in platform_departments %}
      <div class="platform-legacy-card">
        <strong>{{ department }}</strong>
        {% assign stack_parts = platform_legacy_stacks[forloop.index0] | split: " · " %}
        <span class="platform-legacy-tech">{% for part in stack_parts %}<span>{{ part }}</span>{% endfor %}</span>
      </div>
      {% endfor %}
    </div>
    <p class="platform-transition-foot">기술·DB가 분산돼 변경도 프로그램마다 반영</p>
  </div>
  <div class="platform-transition-arrow" aria-hidden="true"><span>통합</span><svg viewBox="0 0 44 24"><path d="M2 12H37M29 4L37 12L29 20" fill="none" stroke="currentColor" stroke-width="2"/></svg></div>
  <div class="platform-transition-after">
    <div class="platform-transition-heading"><span>AFTER</span><strong>하나의 웹 플랫폼에서 함께 사용</strong></div>
    <p class="platform-transition-subtitle">5개 업무부를 연결하고, 공통 기준과 연동은 함께 사용</p>
    <div class="platform-unified-system">
      <div class="platform-unified-departments">
        {% for department in platform_departments %}
        <div><strong>{{ department | replace: "항공", "항공<wbr>" | replace: "해운", "해운<wbr>" }}</strong></div>
        {% endfor %}
      </div>
      <div class="platform-unified-connector" aria-hidden="true"></div>
      <div class="platform-shared-functions">거래처 정보 · 본사 입력·관세청 조회 등 외부 연동</div>
      <div class="platform-shared-data">항공·해운·재무 데이터를 PostgreSQL로 통합</div>
    </div>
    <p class="platform-transition-foot">부서마다 관리하던 거래처 정보와 기능을 함께 사용</p>
  </div>
</figure>
