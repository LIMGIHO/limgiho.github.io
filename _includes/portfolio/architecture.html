<figure class="architecture-figure" id="architecture-before-after">
  <svg viewBox="0 0 1000 430" role="img" aria-labelledby="architecture-title architecture-description">
    <title id="architecture-title">15종 레거시 시스템의 통합 플랫폼 전환 구조</title>
    <desc id="architecture-description">분산된 업무 클라이언트, 자동화 도구, 정산 재무, 외부 연동, 이기종 데이터베이스가 Web, API, Queue, Worker, 다섯 업무 도메인과 통합 데이터 및 외부 어댑터 구조로 전환됩니다.</desc>
    <g class="architecture-before">
      <text class="architecture-kicker" x="42" y="44">BEFORE · 15 SYSTEMS</text>
      <rect class="architecture-group" x="42" y="68" width="350" height="300" rx="18"></rect>
      <rect class="architecture-node" x="70" y="100" width="132" height="54" rx="8"></rect>
      <text x="136" y="132" text-anchor="middle">업무 클라이언트</text>
      <rect class="architecture-node" x="230" y="100" width="132" height="54" rx="8"></rect>
      <text x="296" y="132" text-anchor="middle">자동화 도구</text>
      <rect class="architecture-node" x="70" y="181" width="132" height="54" rx="8"></rect>
      <text x="136" y="213" text-anchor="middle">정산 · 재무</text>
      <rect class="architecture-node" x="230" y="181" width="132" height="54" rx="8"></rect>
      <text x="296" y="213" text-anchor="middle">외부 연동</text>
      <rect class="architecture-node" x="70" y="262" width="292" height="72" rx="8"></rect>
      <text x="216" y="293" text-anchor="middle">이기종 DB</text>
      <text class="architecture-sub" x="216" y="314" text-anchor="middle">Oracle · MySQL · PostgreSQL</text>
    </g>
    <g class="architecture-transition">
      <path d="M420 218 H500"></path>
      <path d="M484 202 L500 218 L484 234"></path>
      <text x="460" y="189" text-anchor="middle">점진적 전환</text>
    </g>
    <g class="architecture-after">
      <text class="architecture-kicker" x="548" y="44">AFTER · INTEGRATED PLATFORM</text>
      <rect class="architecture-group architecture-group-after" x="548" y="68" width="410" height="300" rx="18"></rect>
      <rect class="architecture-node architecture-node-accent" x="580" y="96" width="346" height="52" rx="8"></rect>
      <text x="753" y="127" text-anchor="middle">Web · 90+ 업무 화면</text>
      <rect class="architecture-node" x="580" y="172" width="102" height="50" rx="8"></rect>
      <text x="631" y="202" text-anchor="middle">API</text>
      <rect class="architecture-node" x="702" y="172" width="102" height="50" rx="8"></rect>
      <text x="753" y="202" text-anchor="middle">Queue</text>
      <rect class="architecture-node" x="824" y="172" width="102" height="50" rx="8"></rect>
      <text x="875" y="202" text-anchor="middle">Worker</text>
      <rect class="architecture-node architecture-node-accent" x="580" y="246" width="346" height="48" rx="8"></rect>
      <text x="753" y="275" text-anchor="middle">5개 업무 도메인</text>
      <rect class="architecture-node" x="580" y="316" width="163" height="30" rx="7"></rect>
      <text class="architecture-small" x="661" y="336" text-anchor="middle">통합 데이터</text>
      <rect class="architecture-node" x="763" y="316" width="163" height="30" rx="7"></rect>
      <text class="architecture-small" x="844" y="336" text-anchor="middle">외부 어댑터</text>
    </g>
  </svg>
  <div class="architecture-mobile" id="architecture-mobile" aria-label="모바일용 아키텍처 요약">
    <div data-mobile-architecture>
      <span>BEFORE · 15 SYSTEMS</span>
      <ul>{% for item in include.flagship.architecture.before %}<li>{{ item }}</li>{% endfor %}</ul>
    </div>
    <span class="architecture-mobile-arrow" aria-hidden="true">↓</span>
    <div data-mobile-architecture>
      <span>AFTER · INTEGRATED PLATFORM</span>
      <ul>{% for item in include.flagship.architecture.after %}<li>{{ item }}</li>{% endfor %}</ul>
    </div>
  </div>
  <figcaption>실제 시스템명과 연결 정보는 익명화하고, 15종 운영 시스템이 책임과 경계를 가진 플랫폼으로 수렴한 흐름만 표현했습니다.</figcaption>
</figure>
