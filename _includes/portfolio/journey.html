<section class="portfolio-section journey-section" id="career-journey" aria-labelledby="journey-title" data-reveal>
  <header class="section-heading">
    <p class="section-number">01 · CAREER JOURNEY</p>
    <h2 id="journey-title">주요 경력</h2>
    <p>제조·물류 시스템을 개발하고 운영해 온 경험을 시간순으로 정리했습니다.</p>
  </header>
  <ol class="journey-list">
    {% for item in include.journey %}
      <li class="journey-item" data-journey-item id="journey-{{ item.id }}">
        <time>{{ item.period }}</time>
        <div class="journey-content">
          <p class="journey-meta">{{ item.company }}</p>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      </li>
    {% endfor %}
  </ol>
</section>
