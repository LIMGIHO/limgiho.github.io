<section class="portfolio-section writings-section" id="writings" aria-labelledby="writings-title" data-reveal>
  <header class="section-heading">
    <p class="section-number">04 · WRITING</p>
    <h2 id="writings-title">기록</h2>
  </header>

  <div class="writings-list">
    {% for item in include.items %}
      {% assign writing = include.profile.writing_overrides[item.title] | default: item %}
      <article>
        <h3>{{ item.title }}</h3>
        <p>{{ writing.summary }}</p>
        <p class="writing-facts">{{ writing.facts | join: " · " }}</p>
        <a class="writing-link" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">velog에서 읽기</a>
      </article>
    {% endfor %}
  </div>
</section>
