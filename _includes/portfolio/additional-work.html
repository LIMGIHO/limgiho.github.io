<section class="portfolio-section additional-work-section" id="additional-work" aria-labelledby="additional-work-title">
  <header class="section-heading">
    <p class="section-number">05 · ADDITIONAL WORK</p>
    <h2 id="additional-work-title">직접 만들고 운영한 제품</h2>
    <p>지원 직무와 연결되는 개인 프로젝트만 간결하게 정리했습니다.</p>
  </header>
  <div class="additional-work-list">
    {% for item in include.items %}
      <article>
        <h3>{{ item.title }}</h3>
        <p>{{ item.summary }}</p>
        <p class="technology-list">{{ item.technologies | join: " · " }}</p>
        <div class="work-links">
          {% for link in item.links %}<a href="{{ link.url }}">{{ link.label }}</a>{% endfor %}
        </div>
      </article>
    {% endfor %}
  </div>
</section>
