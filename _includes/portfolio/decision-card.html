<article class="decision-card{% if include.featured %} is-featured{% endif %}" data-decision-id="{{ include.decision.id }}">
  <div class="decision-card-head">
    {% if include.featured %}<span class="decision-badge">핵심 판단</span>{% endif %}
    <h3>{{ include.decision.title }}</h3>
    <p class="decision-result">{{ include.decision.result }}</p>
  </div>
  <button class="decision-toggle" type="button" aria-expanded="true" aria-controls="decision-{{ include.decision.id }}">판단 과정 접기</button>
  <div class="decision-detail" id="decision-{{ include.decision.id }}">
    <dl>
      <dt>문제</dt>
      <dd>{{ include.decision.problem }}</dd>
      <dt>검토</dt>
      <dd>{{ include.decision.alternative }}</dd>
      <dt>선택</dt>
      <dd>{{ include.decision.choice }}</dd>
      <dt>결과</dt>
      <dd>{{ include.decision.result }}</dd>
    </dl>
  </div>
</article>
