<section class="delivery-flow" id="delivery-flow" aria-labelledby="delivery-flow-title">
  <div class="subsection-heading">
    <p class="subsection-label">배포</p>
    <h3 id="delivery-flow-title">{{ include.flow.title }}</h3>
    <p>{{ include.flow.description }}</p>
  </div>

  <figure class="delivery-flow-figure">
    <svg class="delivery-flow-map" viewBox="0 0 1220 260" role="img" aria-labelledby="delivery-flow-map-title delivery-flow-map-description">
      <title id="delivery-flow-map-title">테스트 실패가 배포에 도달하지 못하고 끊기는 배포 파이프라인</title>
      <desc id="delivery-flow-map-description">git push부터 변경 경로 판별, 변경된 앱만 병렬 실행, 테스트 게이트, 실패 시 배포 차단, 통과 시 Kaniko 빌드와 Swarm 롤링 업데이트까지의 흐름을 나타냅니다. 실패 경로는 배포 노드에 연결되지 않고 끊어져 있습니다.</desc>
      <defs>
        <marker id="arrow-dep-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker>
        <marker id="arrow-dep-branch-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker>
        <marker id="arrow-dep-branch-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker>
        <marker id="arrow-dep-skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker>
      </defs>

      <g class="delivery-flow-boundary">
        {% assign b = include.flow.boundary %}
        <rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.width }}" height="{{ b.height }}" rx="16"></rect>
        <text class="boundary-label" x="{{ b.x | plus: 16 }}" y="{{ b.y | plus: 22 }}">{{ b.label }}</text>
        <text class="boundary-description" x="{{ b.x | plus: 16 }}" y="{{ b.y | plus: 38 }}">{{ b.description }}</text>
      </g>

      <g class="delivery-flow-edges" aria-hidden="true">
        {% for edge in include.flow.edges %}
          <g class="delivery-flow-edge delivery-flow-edge-{{ edge.kind }}">
            <path d="{{ edge.path }}" marker-end="url(#arrow-dep-{{ edge.kind }})"></path>
            {% if edge.label != "" %}
              <text x="{{ edge.label_x }}" y="{{ edge.label_y }}">{{ edge.label }}</text>
            {% endif %}
          </g>
        {% endfor %}
      </g>

      <g class="delivery-flow-nodes">
        {% for node in include.flow.nodes %}
          <g class="delivery-flow-node delivery-flow-node-{{ node.kind }}">
            <rect x="{{ node.x }}" y="{{ node.y }}" width="{{ node.width }}" height="{{ node.height }}" rx="10"></rect>
            <text class="node-label" x="{{ node.x | plus: 14 }}" y="{{ node.y | plus: 27 }}">{{ node.label }}</text>
            <text class="node-detail" x="{{ node.x | plus: 14 }}" y="{{ node.y | plus: 46 }}">{{ node.detail }}</text>
          </g>
        {% endfor %}
      </g>
    </svg>
    <figcaption>실패 경로는 배포 차단 노드에서 끊어지고 어떤 배포 노드로도 이어지지 않습니다. 흐린 노드는 변경이 없어 건너뛴 앱입니다.</figcaption>
  </figure>
</section>
